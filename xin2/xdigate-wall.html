<title>XDIGATE Artifact Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a tilted wall of artifact cards fills the sidebar-indigo stage and keeps regenerating; one glass panel in front carries the headline, the counts, approvals and the command. Single deliberate dark look in XDIGATE colors. */
:root{
  --indigo-900:#190c58; --indigo-700:#322375;
  --violet:#7c3aed; --violet-500:#8b5cf6; --violet-300:#c4b5fd;
  --card:#ffffff; --border:#e7e4f5; --column:#f9f8fd;
  --ink:#1e1b4b; --ink-2:#4c4878; --mute:#8a86ad;
  --s-todo:#9490b8; --s-run:#3b82f6; --s-review:#f59e0b; --s-done:#10b981;
  --t-amber-bg:#fef3c7; --t-amber:#b45309; --t-green-bg:#ecfdf5; --t-green:#047857; --t-violet-bg:#f5f3ff; --t-violet:#6d28d9;
  --on:#fff; --on-2:rgba(255,255,255,.74); --on-3:rgba(255,255,255,.45);
  --f-body:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--indigo-900);color:var(--on);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--violet-300);outline-offset:2px;border-radius:8px}

.app{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse 60% 50% at 70% 40%,rgba(124,58,237,.35),transparent 70%),linear-gradient(160deg,var(--indigo-700),var(--indigo-900) 60%)}

/* the wall */
.stage{position:absolute;inset:0;perspective:1500px;perspective-origin:60% 20%;mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%)}
.app::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(25,12,88,.75) 0%,rgba(25,12,88,.25) 40%,transparent 60%)}
.top,.panel{z-index:6}
.wall{position:absolute;left:-12%;right:-18%;top:-6%;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;transform:rotateX(34deg) rotateZ(-7deg) translateY(-4%);transform-origin:50% 0;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:rotateX(34deg) rotateZ(-7deg) translateY(-7%)}}
.tile{background:var(--card);color:var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);box-shadow:0 18px 40px rgba(8,4,40,.35);transition:box-shadow .5s,border-color .5s;position:relative;overflow:hidden}
.tile .pv{height:96px;border-radius:9px;overflow:hidden;position:relative;background:#f7f6fc}
.tile .tt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);min-width:0}
.tile .meta span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.review{border-color:var(--s-review);box-shadow:0 0 0 2px rgba(245,158,11,.7),0 0 40px rgba(245,158,11,.45)}
.tile.pop{animation:pop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.92)}100%{transform:none}}
.tile.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(16,185,129,.9),0 0 50px rgba(16,185,129,.6)}100%{box-shadow:0 18px 40px rgba(8,4,40,.35)}}
/* generating state */
.tile.gen{background:#24176a;border-color:#3b2c8c;color:var(--on)}
.tile.gen .pv{background:linear-gradient(90deg,#2d1f7a 0%,#45339c 50%,#2d1f7a 100%);background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.tile.gen .tt{color:var(--on)}
.tile.gen .meta{color:var(--violet-300)}
.sk{display:block;height:8px;border-radius:4px;background:#3b2c8c}
.tile.empty{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.07);box-shadow:none}
.tile.empty>*{visibility:hidden}
.tag{font-size:10.5px;border-radius:6px;padding:1px 6px;white-space:nowrap;flex:none}
.tag.done{background:var(--t-green-bg);color:var(--t-green)}
.tag.review{background:var(--t-amber-bg);color:var(--t-amber)}
.tag.ops{background:var(--t-violet-bg);color:var(--t-violet)}
.tag.gen{background:rgba(59,130,246,.2);color:#93c5fd}
.av{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700;flex:none}

/* previews */
.th{position:absolute;inset:0}
.th.deck{background:linear-gradient(135deg,var(--violet),var(--indigo-700));padding:12px;display:flex;flex-direction:column;gap:6px}
.th.deck i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.9)}
.th.deck i:nth-child(1){width:60%;height:9px}
.th.deck i:nth-child(2){width:40%;background:rgba(255,255,255,.55)}
.th.deck b{position:absolute;right:12px;bottom:12px;width:48px;height:34px;border-radius:5px;background:var(--s-review)}
.th.post{display:grid;grid-template-columns:42% 1fr;background:#fff}
.th.post .img{background:linear-gradient(135deg,#fecdd3,#fda4af 60%,#fb7185)}
.th.post .ln{padding:10px;display:flex;flex-direction:column;gap:6px}
.th.post .ln i{height:5px;border-radius:3px;background:#e5e3f0;display:block}
.th.post .ln i:first-child{width:80%;background:#cbc7e0;height:7px}
.th.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:#fff}
.th.grid i{border-radius:5px;display:block}
.th.grid i:nth-child(1){background:linear-gradient(135deg,#ddd6fe,#a78bfa)}
.th.grid i:nth-child(2){background:linear-gradient(135deg,#bfdbfe,#60a5fa)}
.th.grid i:nth-child(3){background:linear-gradient(135deg,#fde68a,#f59e0b)}
.th.grid i:nth-child(4){background:linear-gradient(135deg,#a7f3d0,#10b981)}
.th.chart{display:flex;align-items:flex-end;gap:5px;padding:26px 12px 8px;background:#fff}
.th.chart i{flex:1;border-radius:3px 3px 0 0;background:var(--violet-300);display:block}
.th.chart i:last-child{background:var(--violet)}
.th.chart::before{content:"";position:absolute;left:12px;top:11px;height:6px;border-radius:3px;background:#cbc7e0;width:40%}
.th.pdp{background:#fff;display:flex;justify-content:center;padding-top:8px}
.th.pdp .ph{width:46px;height:100px;border-radius:7px;border:1.5px solid #cbc7e0;padding:4px;display:flex;flex-direction:column;gap:3px}
.th.pdp .ph i{display:block;border-radius:2px;background:#e5e3f0;height:4px}
.th.pdp .ph i:first-child{height:30px;background:linear-gradient(135deg,#bfdbfe,#60a5fa)}
.th.doc{background:#fff;padding:12px;display:flex;flex-direction:column;gap:6px}
.th.doc i{display:block;height:5px;border-radius:3px;background:#e5e3f0}
.th.doc i:first-child{width:50%;height:8px;background:var(--ink-2)}
.th.doc i:nth-child(3){width:85%}
.th.doc i:nth-child(5){width:55%}
.th.alert{background:var(--t-amber-bg);display:grid;place-items:center}
.th.alert b{width:38px;height:38px;border-radius:50%;background:var(--s-review);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}

/* header */
.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:18px 24px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--violet-500);display:grid;place-items:center;box-shadow:0 0 24px rgba(139,92,246,.6)}
.mark svg{width:14px;height:14px}
.wordmark{font-weight:700;letter-spacing:.18em;font-size:15px;line-height:1.1}
.wordmark small{display:block;font-weight:400;letter-spacing:.28em;font-size:10px;color:var(--on-2);margin-top:2px}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--t-violet-bg);color:var(--violet);font-weight:600}

/* glass panel */
.panel{position:absolute;left:24px;top:50%;transform:translateY(-46%);z-index:6;width:min(440px,calc(100% - 48px));background:rgba(25,12,88,.72);border:1px solid rgba(196,181,253,.25);border-radius:20px;padding:24px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px rgba(8,4,40,.55)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--violet-300)}
.panel h1{margin:8px 0 0;font-size:clamp(24px,2.6vw,32px);line-height:1.22;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.panel h1 .big{color:#fff;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#c4b5fd,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;margin-top:20px}
.stat{background:rgba(25,12,88,.65);padding:11px 12px}
.stat .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11.5px;color:var(--on-2);display:flex;align-items:center;gap:6px;margin-top:3px}
.stat .k i{width:7px;height:7px;border-radius:50%}
.stat.you .n{color:var(--s-review)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.amber{background:var(--t-amber-bg);color:var(--t-amber)}
.btn.amber b{display:grid;place-items:center;min-width:21px;height:21px;border-radius:999px;background:var(--s-review);color:#fff;font-size:12px;padding:0 6px}
.btn.amber:hover{background:#fdeaa8}
.btn.violet{background:var(--violet);color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.45)}
.btn.violet:hover{background:#8b4cf5}
.cmd{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--card);border-radius:12px;padding:5px 5px 5px 12px;margin-top:14px}
.wall-scope{display:flex;flex:0 0 100%;align-items:center;gap:10px;min-width:0;padding:5px 6px 7px 0;border-bottom:1px solid var(--border);color:var(--ink-2);font-size:11px;color-scheme:light}
.wall-scope-field{display:flex;align-items:center;gap:5px;min-width:0}
.wall-scope-field>span{white-space:nowrap}
.wall-scope-field.activity{flex:1}
.wall-scope details{position:relative;min-width:0;flex:1}
.wall-scope summary{display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:0;padding:5px 6px;border-radius:6px;background:var(--column);color:var(--ink);cursor:pointer;list-style:none}
.wall-scope summary::-webkit-details-marker{display:none}
.wall-scope summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall-scope summary svg{flex:0 0 auto}
.wall-scope-menu{position:absolute;bottom:calc(100% + 5px);left:0;z-index:10;min-width:150px;max-height:220px;overflow:auto;padding:4px;border:1px solid var(--border);border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(20,15,45,.18)}
.activity .wall-scope-menu{left:auto;right:0;min-width:210px}
.cmd .wall-scope-menu button{display:block;width:100%;background:transparent;color:var(--ink);border-radius:5px;padding:8px;font-size:12px;text-align:left;font-weight:400}
.cmd .wall-scope-menu button:hover,.cmd .wall-scope-menu button[aria-pressed="true"]{background:var(--t-violet-bg);color:var(--violet)}
.wall-create-campaign{margin-top:4px;border-top:1px solid var(--border);padding:8px;color:var(--violet);font-size:12px}
.cmd button[type="submit"]:disabled{background:#E7E5EC;color:#9691A5;cursor:not-allowed}
.panel{max-height:calc(100dvh - 112px)}
.panel[data-v="appr"]{overflow-y:auto;overscroll-behavior:contain}
@media(max-height:680px) and (min-width:761px){.panel{padding:18px;top:80px;transform:none;max-height:calc(100dvh - 96px)}.panel h1{font-size:25px}}
.cmd .spark{color:var(--violet-500)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13.5px;color:var(--ink)}
.cmd input::placeholder{color:var(--mute)}
.cmd button{border:0;background:#f5f3ff;color:var(--violet);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.cmd button:hover{background:#ede9fe}

/* approvals view inside the panel */
.appr-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.appr-h b{font-size:15px}
.back{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:var(--on);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);color:var(--ink);border-left:3px solid var(--s-review);border-radius:11px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;transition:opacity .3s,transform .3s}
.row.out{opacity:0;transform:translateX(16px)}
.row .tt{font-size:13px;font-weight:600}
.row .imp{font-size:12px;color:var(--ink-2);margin-top:1px}
.go{border:0;background:var(--violet);color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.clear{color:#6ee7b7;font-size:13.5px;padding:8px 0}

/* small X on every newly created tile */
.tile .tx{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:2}
.tile .tx i{position:absolute;width:28%;height:3px;border-radius:4px;background:#fff;box-shadow:0 0 10px 3px rgba(167,139,250,.95),0 0 30px 8px rgba(124,58,237,.5);opacity:0}
.tile .tx i:nth-child(1){animation:tx1 .85s ease-out forwards}
.tile .tx i:nth-child(2){animation:tx2 .85s ease-out .12s forwards}
@keyframes tx1{0%{opacity:1;transform:rotate(45deg) scaleX(0)}30%{opacity:1;transform:rotate(45deg) scaleX(1)}65%{opacity:1}100%{opacity:0;transform:rotate(45deg) scaleX(1.25)}}
@keyframes tx2{0%{opacity:1;transform:rotate(-45deg) scaleX(0)}30%{opacity:1;transform:rotate(-45deg) scaleX(1)}65%{opacity:1}100%{opacity:0;transform:rotate(-45deg) scaleX(1.25)}}
/* X strike */
.xs{position:absolute;inset:0 0 0 min(30%,420px);z-index:8;pointer-events:none;display:grid;place-items:center}
.xs i{position:absolute;width:min(52vmin,520px);height:clamp(4px,.7vmin,8px);border-radius:99px;background:linear-gradient(90deg,rgba(196,181,253,0),#ede9fe 70%,#fff);box-shadow:0 0 30px 6px rgba(167,139,250,.9),0 0 90px 20px rgba(124,58,237,.6);transform-origin:center;opacity:0}
.xs i:nth-child(1){transform:rotate(38deg) scaleX(0);animation:blade .38s cubic-bezier(.2,.8,.2,1) .15s forwards, bfade .6s ease 1.25s forwards}
.xs i:nth-child(2){transform:rotate(-38deg) scaleX(0);animation:blade2 .38s cubic-bezier(.2,.8,.2,1) .45s forwards, bfade .6s ease 1.25s forwards}
@keyframes blade{from{opacity:1;transform:rotate(38deg) scaleX(0)}to{opacity:1;transform:rotate(38deg) scaleX(1)}}
@keyframes blade2{from{opacity:1;transform:rotate(-38deg) scaleX(0)}to{opacity:1;transform:rotate(-38deg) scaleX(1)}}
@keyframes bfade{to{opacity:0;transform:rotate(0) scaleX(.02)}}
.xs b{position:absolute;inset:0;background:radial-gradient(circle,rgba(237,233,254,.7),rgba(124,58,237,0) 60%);opacity:0;animation:xflash .7s ease .8s}
@keyframes xflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* screensaver */
.panel,.top .right,.app::after{transition:opacity .9s ease,transform .9s ease}
.saver-clock{position:absolute;right:36px;bottom:30px;z-index:6;text-align:right;opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
.saver-clock::before{content:"";position:absolute;right:-36px;bottom:-30px;width:min(980px,100vw);height:460px;z-index:-1;background:radial-gradient(ellipse at 100% 100%,rgba(16,7,60,.96) 0%,rgba(16,7,60,.75) 38%,rgba(16,7,60,0) 70%)}
.saver-clock .t{font-size:clamp(64px,9vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 10px 40px rgba(8,4,40,.6)}
.saver-clock .s{font-size:15px;color:var(--on-2);margin-top:10px;display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.saver-clock .s b{color:#fff;font-weight:600}
.saver-clock .s em{font-style:normal;color:#fcd34d;font-weight:600}
.saver-clock .hint{font-size:12px;color:var(--on-3);margin-top:8px}
body.saver .panel,body.saver .top .right{opacity:0;pointer-events:none}
body.saver .panel{transform:translateY(-46%) translateX(-24px)}
body.saver .app::after{opacity:.35}
body.saver .saver-clock{opacity:1;transform:none}
body.saver{cursor:none}
.ss{border:0;background:rgba(255,255,255,.1);color:var(--on-2);border-radius:10px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.ss:hover{color:#fff;background:rgba(255,255,255,.16)}
@media (max-width:820px){
  .xs{inset:0}
  body.saver .panel{transform:translateY(20px)}
  .saver-clock{right:16px;bottom:24px}
  .wall{left:-4%;right:-4%;grid-template-columns:repeat(2,minmax(0,1fr));transform:rotateX(26deg) translateY(-2%);animation:none}
  .panel{top:auto;bottom:16px;left:16px;right:16px;width:auto;transform:none;padding:18px}
  .top{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 ['seo','doc','B2B 博客 · 2 篇','B2B articles · 2'],['cs','doc','客服回复草稿 ×46','Support reply drafts ×46'],['adopt','chart','替换 2 条低效创意','Swapped 2 weak creatives'],
 ['pub','post','抖音发布 · 2 条','Douyin posts · 2'],['cgen','post','小红书笔记 ×3','Xiaohongshu notes ×3'],['msg','doc','召回短信 · 3 版','Win-back SMS · 3 variants'],
 ['camp','doc','秋季活动排期','Autumn campaign schedule'],['kb','doc','知识库新增 9 条','9 entries indexed'],['cgen','post','秋日穿搭笔记','Autumn outfit note'],
 ['pub','post','小红书已发布','Live on Xiaohongshu'],['adopt','chart','放量 · 秋季新品','Scaled autumn SKUs'],['seo','doc','关键词集群 · 第 3 批','Keyword cluster · batch 3'],
 ['camp','doc','直播排期表','Livestream schedule'],['msg','doc','会员日触达文案','Member-day outreach'],['cs','doc','售后话术更新','After-sales script update'],
];
/* work that waits for a human (M1) */
const REVIEW=[
 ['patrol','alert','3 个 SKU 低于控价线','3 SKUs below price floor','预计挽回毛利 ¥18.4k','Recovers est. ¥18.4k margin'],
 ['ppt','deck','双11 主推方案 v2','11.11 hero deck v2','确认后进入视频脚本','Unblocks the video script'],
 ['detail','pdp','新品 A+ 详情页','New A+ detail page','返工率 14%，建议抽查','14% rework, spot-check first'],

function thumb(k){switch(k){
 case 'deck':return '<div class="th deck"><i></i><i></i><b></b></div>';
 case 'post':return '<div class="th post"><div class="img"></div><div class="ln"><i></i><i></i><i></i></div></div>';
 case 'grid':return '<div class="th grid"><i></i><i></i><i></i><i></i></div>';
 case 'chart':return '<div class="th chart">'+[40,58,46,72,64,90].map(v=>`<i style="height:${v}%"></i>`).join('')+'</div>';
 case 'pdp':return '<div class="th pdp"><div class="ph"><i></i><i></i><i></i><i></i></div></div>';
 case 'alert':return '<div class="th alert"><b>!</b></div>';
 default:return '<div class="th doc"><i></i><i></i><i></i><i></i><i></i></div>';}}

/* ---------- state ---------- */
/* work finished earlier in the day, before the tiles now on the wall */
const S={total:106,done:88,ops:18,tiles:[],view:'home'};
let uid=0;
const wall=document.getElementById('wall');

function tileCount(){
  const w=innerWidth, h=innerHeight;
  if(w<=820) return 12;
  const cols=Math.max(4,Math.floor(w*1.3/216));
  return cols*Math.ceil(h*1.25/200);
}
function build(){
  const n=tileCount(); wall.innerHTML=''; S.tiles=[];
  for(let i=0;i<n;i++){ const el=document.createElement('article'); el.className='tile empty'; el.innerHTML='<div class="pv"></div><div class="tt">.</div><div class="meta">.</div>'; wall.appendChild(el); S.tiles.push({el,item:null,status:'empty'}); }
}
function statusOf(ag,isReview){ if(isReview) return 'review'; return AG[ag][3]===3?'done':'ops'; }
const STL={done:['已交付','Delivered'],review:['待审批','In review'],ops:['已交运营','To ops']};
function paintTile(tl){
  const it=tl.item; if(!it) return;
  const a=AG[it.ag];
  tl.el.className='tile '+tl.status;
  tl.el.innerHTML=`<div class="pv">${thumb(it.kind)}</div><div class="tt">${esc(P(it.zh,it.en))}</div>
   <div class="meta"><span class="av" style="background:${DOMC[a[2]]}">${esc(P(a[0],a[1]).replace(/^B2B /,'').slice(0,1))}</span><span class="tag ${tl.status}">${P(...STL[tl.status])}</span><span>${esc(nm(it.ag))}</span></div>`;
}
function genTile(tl,item,isReview,cb){
  tl.el.className='tile gen';
  tl.el.innerHTML=`<div class="pv"></div><div class="tt"><span class="sk" style="width:70%"></span></div><div class="meta"><span class="tag gen">${P('生成中','Generating')}</span><span>${esc(nm(item.ag))}</span></div>`;
  setTimeout(()=>{
    tl.item=item; tl.status=statusOf(item.ag,isReview); paintTile(tl);
    if(!RM){ tl.el.insertAdjacentHTML('beforeend','<div class="tx"><i></i><i></i></div>'); const tx=tl.el.querySelector('.tx'); setTimeout(()=>tx&&tx.remove(),1100); }
    tl.el.classList.add('pop'); setTimeout(()=>tl.el.classList.remove('pop'),800);
    S.total++; if(tl.status==='done') S.done++; if(tl.status==='ops') S.ops++;
    renderPanel(true); cb&&cb(tl);
  }, RM?0:1500+Math.random()*700);
}
const reviewTiles=()=>S.tiles.filter(t=>t.status==='review');
const asItem=w=>({id:++uid,ag:w[0],kind:w[1],zh:w[2],en:w[3],izh:w[4],ien:w[5]});

/* ---------- opening wave: the night shift fills the wall ---------- */
function opening(){
  const order=S.tiles.map((t,i)=>i).sort((a,b)=>b-a); // bottom rows first (closest)
  const reviewSlots=new Set(); // spread 5 review items among the nearest third
  while(reviewSlots.size<5){ reviewSlots.add(order[Math.floor(Math.random()*Math.min(order.length,Math.max(10,order.length/2)))]); }
  let ri=0, ai=0;
  order.forEach((idx,k)=>{
    setTimeout(()=>{
      const isR=reviewSlots.has(idx);
      const w=isR?REVIEW[ri++%REVIEW.length]:AUTO[ai++%AUTO.length];
      genTile(S.tiles[idx],asItem(w),isR);
    }, RM?0:k*(2600/order.length));
  });
}

/* ---------- ambient regeneration ---------- */
let rq=0;
function ambient(){
  if(S.view==='home'||S.view==='appr'){
    const cand=S.tiles.filter(t=>t.status==='done'||t.status==='ops');
    if(cand.length){
      const tl=cand[Math.floor(Math.random()*cand.length)];
      const wantReview = reviewTiles().length<5 && Math.random()<.18;
      const w = wantReview ? REVIEW[(5+rq++)%REVIEW.length] : AUTO[Math.floor(Math.random()*AUTO.length)];
      genTile(tl,asItem(w),wantReview);
    }
  }
  const saver=document.body.classList.contains('saver');
  setTimeout(ambient, RM?8000:(saver?500+Math.random()*500:1300+Math.random()*900));
}

/* ---------- panel ---------- */
const panel=document.getElementById('panel');
const approvals=document.createElement('dialog');approvals.className='wall-approvals';approvals.setAttribute('aria-label','待审批');document.body.appendChild(approvals);
approvals.addEventListener('close',()=>panel.querySelector('#openAppr')?.focus());
approvals.addEventListener('click',event=>{if(event.target===approvals){const rect=approvals.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)approvals.close()}});
const WALL_DRAFT={project:'A80PARIS',campaign:'',intent:''};
// Preview values matching the command bridge; production should supply real monitoring data.
const WALL_MONITORING={signals:12480,handled:1320};
function wallScopeHTML(){
 const arrow='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
 return `<div class="wall-scope"><div class="wall-scope-field"><span>${P('项目','Project')}</span><details id="wallProjectPicker"><summary aria-label="${P('选择项目','Choose project')}"><span>${esc(WALL_DRAFT.project)}</span>${arrow}</summary><div class="wall-scope-menu">${['A80PARIS','NEXA'].map(name=>`<button type="button" onclick="wallSelectScope('project','${name}')" aria-pressed="${WALL_DRAFT.project===name}">${name}</button>`).join('')}</div></details></div><div class="wall-scope-field activity"><span>${P('所属活动','Campaign')}</span><details id="wallCampaignPicker"><summary aria-label="${P('选择所属活动','Choose campaign')}"><span>${WALL_DRAFT.campaign?P('11.11 大促','11.11 campaign'):P('日常（不归属活动）','Daily work (no campaign)')}</span>${arrow}</summary><div class="wall-scope-menu"><button type="button" onclick="wallSelectScope('campaign','')" aria-pressed="${!WALL_DRAFT.campaign}">${P('日常（不归属活动）','Daily work (no campaign)')}</button>${WALL_DRAFT.project==='A80PARIS'?`<button type="button" onclick="wallSelectScope('campaign','c1')" aria-pressed="${WALL_DRAFT.campaign==='c1'}">${P('11.11 大促','11.11 campaign')}</button>`:''}<div class="wall-create-campaign">${P('＋ 创建活动','＋ Create campaign')}</div></div></details></div></div>`;
}
function wallSelectScope(field,value){WALL_DRAFT[field]=value;if(field==='project')WALL_DRAFT.campaign='';renderPanel();panel.querySelector(field==='project'?'#wallProjectPicker summary':'#wallCampaignPicker summary')?.focus()}
document.addEventListener('click',event=>{panel.querySelectorAll('.wall-scope details').forEach(picker=>{if(!picker.contains(event.target))picker.open=false})});
document.addEventListener('keydown',event=>{if(event.key==='Escape')panel.querySelectorAll('.wall-scope details[open]').forEach(picker=>{picker.open=false;picker.querySelector('summary').focus()})});
function renderPanel(soft){
  const nR=reviewTiles().length;
  if(approvals.open)renderAppr();
  if(soft && panel.dataset.v==='home'){
    panel.querySelector('#sd').textContent=WALL_MONITORING.signals.toLocaleString('en-US');
    panel.querySelector('#so').textContent=WALL_MONITORING.handled.toLocaleString('en-US');
    panel.querySelector('#sr').textContent=nR;
    panel.querySelector('#rb').textContent=nR;
    panel.querySelector('#h1n').textContent=nR;
    return;
  }
  panel.dataset.v='home';
  panel.innerHTML=`
   <div class="eyebrow">${P('早上好，Brooks','Good morning, Brooks')}</div>
   <h1>${P(`Agents 正在为你工作，<span id="h1n">${nR}</span> 项需要你确认。`,`Agents are working for you. <span id="h1n">${nR}</span> items need your attention.`)}</h1>
   <div class="stats">
     <div class="stat"><div class="n" id="sd">${WALL_MONITORING.signals.toLocaleString('en-US')}</div><div class="k"><i style="background:var(--s-todo)"></i>${P('条信号','Signals')}</div></div>
     <div class="stat"><div class="n" id="so">${WALL_MONITORING.handled.toLocaleString('en-US')}</div><div class="k"><i style="background:var(--s-done)"></i>${P('由 Agents 处理','Handled by agents')}</div></div>
     <div class="stat you"><div class="n" id="sr">${nR}</div><div class="k"><i style="background:var(--s-review)"></i>${P('需要你','Need you')}</div></div>
   </div>
   <div class="actions">
     <button class="btn amber" id="openAppr">${P('查看待审批','Review approvals')} <b id="rb">${nR}</b></button>
     <a class="btn violet" href="https://home-xdigate.digate.workers.dev" target="_blank" rel="noopener">${P('进入工作台 →','Enter workspace →')}</a>
   </div>
   <form class="cmd" id="cmdForm" autocomplete="off">${wallScopeHTML()}<span class="spark" aria-hidden="true">✦</span><label for="cmdIn" style="position:absolute;left:-9999px">${P('任务需求','Task request')}</label><input id="cmdIn" value="${esc(WALL_DRAFT.intent)}" placeholder="${P('一句话交给 agents，例如：策划双11推广','One sentence, e.g. plan our 11.11 campaign')}"><button type="submit" ${WALL_DRAFT.intent.trim()?'':'disabled'}>${P('交给 Agents','Hand to agents')}</button></form>`;
  panel.querySelector('#openAppr').onclick=()=>{renderAppr();approvals.showModal();positionWallApprovals();};
  panel.querySelector('#cmdIn').oninput=event=>{WALL_DRAFT.intent=event.target.value;panel.querySelector('#cmdForm button[type="submit"]').disabled=!WALL_DRAFT.intent.trim()};
  panel.querySelector('#cmdForm').onsubmit=event=>{
   event.preventDefault();if(!WALL_DRAFT.intent.trim()){panel.querySelector('#cmdIn').focus();return}
   const link=document.createElement('a');link.href='https://home-xdigate.digate.workers.dev/';link.target='_blank';link.rel='noopener noreferrer';document.body.appendChild(link);link.click();link.remove();
  };
}
function positionWallApprovals(){
 if(!approvals.open)return;
 const rect=panel.getBoundingClientRect(),gap=12,space=window.innerWidth-rect.right-gap-24;
 const beside=space>=360,width=beside?Math.min(640,space):Math.min(640,window.innerWidth-32);
 const left=beside?rect.right+gap:(window.innerWidth-width)/2;
 const top=Math.max(16,Math.min(rect.top,window.innerHeight-160));
 Object.assign(approvals.style,{width:width+'px',left:left+'px',top:top+'px',maxHeight:Math.max(128,window.innerHeight-top-24)+'px'});
}
window.addEventListener('resize',positionWallApprovals);
function renderAppr(){
  const rs=reviewTiles();
  approvals.innerHTML=`<div class="appr-h"><b>${P('待审批','In review')}</b><span class="wall-appr-count">${rs.length}</span><button class="back" id="back" aria-label="${P('关闭待审批','Close approvals')}">×</button></div>
   ${rs.length?`<div class="rows">${rs.map((t,i)=>`<div class="row" data-i="${S.tiles.indexOf(t)}"><div style="min-width:0"><div class="tt">${esc(P(t.item.zh,t.item.en))}</div><div class="imp">${esc(P(t.item.izh||'需要你确认',t.item.ien||'Needs your sign-off'))} · ${esc(nm(t.item.ag))} · ${esc(t.item.project||'A80PARIS')}</div></div><button class="go">${P('批准','Approve')}</button></div>`).join('')}</div>`
     :`<div class="clear">✓ ${P('全部审批完成','All approved')}</div>`}`;
  approvals.querySelector('#back').onclick=()=>approvals.close();
  approvals.querySelectorAll('.row').forEach(r=>{
    const tl=S.tiles[+r.dataset.i];
    r.onmouseenter=()=>tl.el.style.outline='3px solid #fff';
    r.onmouseleave=()=>tl.el.style.outline='';
    r.querySelector('.go').onclick=()=>{
      r.classList.add('out'); tl.el.style.outline='';
      setTimeout(()=>{ tl.status='done'; S.done++; paintTile(tl); tl.el.classList.add('flash'); setTimeout(()=>tl.el.classList.remove('flash'),1300); renderAppr();renderPanel(true); },280);
    };
  });
}

/* ---------- command: a cluster of tiles regenerates for one request ---------- */
const PLANS=[
 {re:/双11|双十一|11\.11|大促|推广|campaign|promo|launch/i,items:[['trend','chart','双11 热点筛选','11.11 trend shortlist'],['camp','doc','双11 活动排期','11.11 schedule'],['cgen','post','双11 种草笔记 ×5','11.11 seeding notes ×5'],['pvis','grid','双11 主图 · 8 张','11.11 hero images · 8']],pack:['ppt','deck','双11 推广方案包','11.11 campaign pack','方案、文案、主图已就绪','Plan, copy and visuals ready']},
 {re:/异常|巡检|店铺|库存|价格|anomal|store|stock|price/i,items:[['patrol','alert','库存与价格巡检','Stock and price check'],['analyst','chart','异常原因分析','Anomaly root cause'],['adopt','chart','暂停 2 条低效广告','Paused 2 weak ads']],pack:['report','chart','本周店铺异常报告','Store anomaly report','3 项待你确认','3 items need you']},
 {re:/竞品|competitor|rival/i,items:[['comp','doc','竞品动作汇总','Competitor moves'],['trend','chart','品类趋势对比','Category trends'],['analyst','chart','份额变化分析','Share shift']],pack:['report','chart','10 月竞品月报','October competitor monthly','建议 2 项动作','2 suggested moves']},
];
const DEF={items:[['kb','doc','检索相关资料','References gathered'],['camp','doc','执行计划','Execution plan'],['cgen','post','初稿内容','First drafts']],pack:['orch','doc','任务产出包','Task output pack','计划与初稿已就绪','Plan and drafts ready']};
function runCommand(q){
  q=q.trim(); if(!q) return;
  const plan=PLANS.find(p=>p.re.test(q))||DEF;
  // take the nearest non-review tiles so the result is visible
  const pool=S.tiles.map((t,i)=>({t,i})).filter(o=>o.t.status!=='review'&&o.t.status!=='gen').sort((a,b)=>b.i-a.i).slice(0,10);
  const pick=pool.sort(()=>Math.random()-.5).slice(0,plan.items.length+1).map(o=>o.t);
  plan.items.forEach((w,k)=>setTimeout(()=>{ const tl=pick[k]; genTile(tl,asItem([w[0],w[1],w[2],w[3]]),false); },k*400));
  setTimeout(()=>{ const tl=pick[plan.items.length]; genTile(tl,asItem(plan.pack),true); },plan.items.length*400+900);
}

/* ---------- language ---------- */
function setLang(l){ L=l; try{localStorage.setItem('xd-lang',l)}catch(e){}
  document.documentElement.lang=L==='zh'?'zh-CN':'en';
  document.getElementById('lzh').setAttribute('aria-pressed',L==='zh'); document.getElementById('len').setAttribute('aria-pressed',L==='en');
  S.tiles.forEach(t=>{ if(t.item&&t.status!=='gen') paintTile(t); });
  renderPanel();if(approvals.open)renderAppr();
}
document.getElementById('lzh').onclick=()=>setLang('zh');
document.getElementById('len').onclick=()=>setLang('en');

let rt=null; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ /* keep existing tiles, add or drop to fit */
  const n=tileCount(); while(S.tiles.length<n){ const el=document.createElement('article'); el.className='tile empty'; el.innerHTML='<div class="pv"></div>'; wall.appendChild(el); const tl={el,item:null,status:'empty'}; S.tiles.push(tl); genTile(tl,asItem(AUTO[Math.floor(Math.random()*AUTO.length)]),false); }
  while(S.tiles.length>n){ const tl=S.tiles[S.tiles.length-1]; if(tl.status==='review') break; S.tiles.pop(); tl.el.remove(); }
},300);});

/* ---------- screensaver: after 30s idle (or on demand) the panel steps aside ---------- */
const IDLE=30000; let idleT=null, guard=0;
function enterSaver(){ document.body.classList.add('saver'); guard=performance.now()+700; tickSaver(); }
function exitSaver(){ if(performance.now()<guard) return; document.body.classList.remove('saver'); armIdle(); }
function armIdle(){ clearTimeout(idleT); idleT=setTimeout(enterSaver,IDLE); }
['mousemove','mousedown','keydown','touchstart','wheel'].forEach(ev=>addEventListener(ev,()=>{ if(document.body.classList.contains('saver')) exitSaver(); else armIdle(); },{passive:true}));
document.getElementById('ssBtn').onclick=e=>{ e.stopPropagation(); enterSaver(); };
function tickSaver(){
  const d=new Date(); document.getElementById('svT').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const nR=reviewTiles().length;
  document.getElementById('svS').innerHTML=P(`<span><b>${S.total}</b> 件今日产出</span><span>agents 正在工作</span><span><em>${nR}</em> 件待审批</span>`,`<span><b>${S.total}</b> artifacts today</span><span>agents at work</span><span><em>${nR}</em> in review</span>`);
  document.getElementById('svH').textContent=P('移动鼠标返回','Move the mouse to return');
  document.getElementById('ssBtn').textContent=P('屏保','Screensaver');
}
setInterval(tickSaver,1000); armIdle();

build(); setLang(L);
if(RM){ document.getElementById('xs').remove(); opening(); ambient(); }
else { setTimeout(opening,1000); setTimeout(()=>document.getElementById('xs').remove(),2200); setTimeout(ambient,6200); }
})();
