<title>XDIGATE Command Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: XDIGATE's sidebar indigo becomes the stage for the agent constellation; everything placed on top uses the workspace's own white cards, tags and status colors. Headline top-left, artifact shelf right, command + decisions bottom. */
:root{
  /* brand, sampled from the XDIGATE workspace */
  --indigo-900:#190c58;   /* sidebar */
  --indigo-700:#322375;   /* sidebar active row */
  --violet:#7c3aed;       /* primary button */
  --violet-500:#8b5cf6;   /* logo mark */
  --violet-300:#c4b5fd;
  --lavender:#f3f1fc;     /* workspace background */
  --column:#f9f8fd;       /* board column */
  --card:#ffffff;
  --border:#e7e4f5;
  --ink:#1e1b4b;
  --ink-2:#4c4878;
  --mute:#8a86ad;
  /* status dots */
  --s-todo:#9490b8; --s-run:#3b82f6; --s-review:#f59e0b; --s-done:#10b981;
  /* tags */
  --t-amber-bg:#fef3c7; --t-amber:#b45309;
  --t-green-bg:#ecfdf5; --t-green:#047857;
  --t-violet-bg:#f5f3ff; --t-violet:#6d28d9;
  --t-orange-bg:#fff7ed; --t-orange:#c2410c;
  --t-pink-bg:#fff0f2; --t-pink:#e11d48;
  --teal:#14b8a6;
  /* on-indigo text */
  --on:#ffffff; --on-2:rgba(255,255,255,.72); --on-3:rgba(255,255,255,.45);
  --f-body:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--indigo-900);color:var(--on);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--violet-300);outline-offset:2px;border-radius:8px}

.app{position:relative;height:100%;
  background:radial-gradient(ellipse 50% 55% at 42% 54%,rgba(124,58,237,.30),transparent 70%),
             linear-gradient(160deg,var(--indigo-700),var(--indigo-900) 55%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* header */
.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:18px 24px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--violet-500);display:grid;place-items:center;box-shadow:0 0 24px rgba(139,92,246,.6)}
.mark svg{width:14px;height:14px}
.wordmark{font-weight:700;letter-spacing:.18em;font-size:15px;line-height:1.1}
.wordmark small{display:block;font-weight:400;letter-spacing:.28em;font-size:10px;color:var(--on-2);margin-top:2px}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--on-2);background:rgba(255,255,255,.07);border-radius:10px;padding:6px 11px}
.live b{color:var(--on);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s-done);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}80%,100%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--t-violet-bg);color:var(--violet);font-weight:600}
.enter{background:var(--violet);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:0 6px 18px rgba(124,58,237,.45)}
.enter:hover{background:#8b4cf5}

/* headline */
.side{position:absolute;left:0;top:0;bottom:0;width:400px;z-index:3;display:flex;flex-direction:column;padding:104px 32px 28px;
  background:linear-gradient(180deg,#1b0e5c,#140848);border-right:1px solid rgba(196,181,253,.16);box-shadow:24px 0 70px rgba(6,2,30,.45)}
.hero{pointer-events:none}
.side .hero h1{font-size:clamp(24px,2.1vw,30px)}
.legend{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--on-2);padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:18px;display:inline-flex;justify-content:center;font-style:normal}
.lg-swirl{width:14px;height:14px;border-radius:50%;border:1.5px dashed var(--violet-300)}
.lg-gate{width:8px;height:8px;border-radius:50%;background:var(--s-review);box-shadow:0 0 10px var(--s-review)}
.lg-wave{width:14px;height:8px;border-radius:50%;border:1.5px solid var(--violet-300)}
.eyebrow{font-size:12px;font-weight:600;color:var(--violet-300);letter-spacing:.04em}
.hero h1{font-weight:700;font-size:clamp(26px,3vw,38px);line-height:1.22;margin:10px 0 0;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--s-review)}
.flow{display:flex;flex-direction:column;margin-top:30px;border-top:1px solid rgba(255,255,255,.1)}
.flow>div:not(.arr){display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.flow .n{order:1;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.flow .k{font-size:13px;color:var(--on-2);display:flex;align-items:center;gap:8px}
.flow .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.flow .arr{display:none}
.flow .you .n{color:var(--s-review)}

/* artifact shelf — white cards in the workspace style */
.shelf{position:absolute;right:24px;top:92px;bottom:96px;z-index:4;width:300px;background:var(--column);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:0 24px 60px rgba(8,4,40,.45)}
.shelf-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.shelf-h .dt{width:8px;height:8px;border-radius:50%;background:var(--s-done)}
.shelf-h b{font-size:14px;font-weight:600}
.count{font-size:12px;color:var(--ink-2);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums;background:var(--card)}
.shelf-h .sub{margin-left:auto;font-size:11.5px;color:var(--mute)}
.shelf-filter{display:flex;align-items:center;gap:8px;padding:0 4px;color:var(--ink-2);font-size:12px;color-scheme:light}
.shelf-owner-picker{position:relative}
.shelf-owner-picker summary{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid #DADAE1;border-radius:999px;background:#fff;color:#484852;list-style:none;cursor:pointer}
.shelf-owner-picker summary::-webkit-details-marker{display:none}
.shelf-owner-picker summary:hover{background:#F7F7F8}
.shelf-filter .shelf-owner-picker{min-width:0}
.shelf-filter summary{gap:6px;padding-inline:10px}
.shelf-filter summary span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shelfProjectMenu{left:auto;right:0}
.shelf-owner-picker.has-owner summary{border-color:var(--violet-300);background:var(--t-violet-bg);color:var(--violet)}
.shelf-owner-picker.has-owner summary:hover{background:#EDE9FE}
.shelf-owner-picker summary:focus-visible,.shelf-owner-menu button:focus-visible{outline:2px solid #92929D;outline-offset:2px;border-radius:6px}
.shelf-owner-menu{position:absolute;top:calc(100% + 5px);left:0;z-index:12;min-width:160px;max-height:240px;overflow:auto;padding:4px;border:1px solid #E2E2E7;border-radius:8px;background:#fff;box-shadow:0 5px 18px rgba(20,20,30,.12);scrollbar-width:thin;scrollbar-color:#DADAE1 transparent}
.shelf-owner-menu button{display:block;width:100%;padding:8px 10px;border:0;border-radius:5px;background:transparent;color:#484852;font:inherit;text-align:left;cursor:pointer}
.shelf-owner-menu button:hover{background:#F6F6F7}
.shelf-owner-menu button.selected{background:#EEEEF1;color:#282832;font-weight:600}
.shelf-empty{padding:24px 8px;color:var(--ink-2);font-size:12px;line-height:1.6;text-align:center}
.stack{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.stack .art{flex-shrink:0}
.art{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--bar,var(--s-done));border-radius:12px;padding:10px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.art:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,27,75,.10)}
.art.new{animation:land .9s ease-out}
@keyframes land{0%{transform:translateY(-12px) scale(.97);opacity:0;box-shadow:0 0 0 3px rgba(124,58,237,.35)}40%{opacity:1}100%{transform:none;box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.art .tt{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .by{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);margin-top:6px;min-width:0}
.art .by span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;white-space:nowrap;border:1px solid transparent}
.tag.done{background:var(--t-green-bg);color:var(--t-green);border-color:#c9f2e0}
.tag.review{background:var(--t-amber-bg);color:var(--t-amber);border-color:#fbe3a0}
.tag.ops{background:var(--t-violet-bg);color:var(--t-violet);border-color:#e6defe}
.tag.m{background:var(--t-green-bg);color:var(--t-green);border-color:#c9f2e0;font-weight:600}
.tag.kind{background:#f4f2fb;color:var(--ink-2);border-color:var(--border)}

/* mini previews */
.th{height:52px;border-radius:7px;overflow:hidden;position:relative;border:1px solid var(--border);background:#fff}
.th.deck{background:linear-gradient(135deg,var(--violet),var(--indigo-700));padding:7px;display:flex;flex-direction:column;gap:3px}
.th.deck i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.9)}
.th.deck i:nth-child(1){width:70%;height:6px}
.th.deck i:nth-child(2){width:45%;background:rgba(255,255,255,.55)}
.th.deck b{position:absolute;right:6px;bottom:6px;width:20px;height:16px;border-radius:3px;background:var(--s-review)}
.th.post{display:grid;grid-template-rows:1fr auto;background:#fff}
.th.post .img{background:linear-gradient(135deg,#fecdd3,#fda4af 60%,#fb7185)}
.th.post .ln{padding:3px 5px;display:flex;flex-direction:column;gap:2px}
.th.post .ln i{height:3px;border-radius:2px;background:#e5e3f0;display:block}
.th.post .ln i:first-child{width:80%;background:#cbc7e0}
.th.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;background:#fff}
.th.grid i{border-radius:3px;display:block}
.th.grid i:nth-child(1){background:linear-gradient(135deg,#ddd6fe,#a78bfa)}
.th.grid i:nth-child(2){background:linear-gradient(135deg,#bfdbfe,#60a5fa)}
.th.grid i:nth-child(3){background:linear-gradient(135deg,#fde68a,#f59e0b)}
.th.grid i:nth-child(4){background:linear-gradient(135deg,#a7f3d0,#10b981)}
.th.chart{display:flex;align-items:flex-end;gap:3px;padding:6px 7px;background:#fff}
.th.chart i{flex:1;border-radius:2px 2px 0 0;background:var(--violet-300);display:block}
.th.chart i:last-child{background:var(--violet)}
.th.chart::before{content:"";position:absolute;left:7px;right:7px;top:7px;height:3px;border-radius:2px;background:#e5e3f0;width:45%}
.th.pdp{background:#fff;display:flex;justify-content:center;padding-top:4px}
.th.pdp .ph{width:28px;height:60px;border-radius:5px;border:1.5px solid #cbc7e0;padding:3px;display:flex;flex-direction:column;gap:2px}
.th.pdp .ph i{display:block;border-radius:2px;background:#e5e3f0;height:3px}
.th.pdp .ph i:first-child{height:16px;background:linear-gradient(135deg,#bfdbfe,#60a5fa)}
.th.pdp .ph i:nth-child(2){width:70%;background:#cbc7e0}
.th.doc{background:#fff;padding:7px;display:flex;flex-direction:column;gap:3px}
.th.doc i{display:block;height:3px;border-radius:2px;background:#e5e3f0}
.th.doc i:first-child{width:60%;height:5px;background:var(--ink-2)}
.th.doc i:nth-child(3){width:85%}
.th.doc i:nth-child(5){width:50%}
.th.alert{background:var(--t-amber-bg);display:grid;place-items:center}
.th.alert b{font-size:18px;color:var(--s-review);font-weight:700}

/* bottom bar */
.bottom{position:absolute;left:400px;right:348px;bottom:24px;z-index:6;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.cmd{width:min(520px,100%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 14px 40px rgba(8,4,40,.45)}
.cmd-scope{display:flex;align-items:center;gap:12px;flex:0 0 100%;min-width:0;padding:7px 6px 2px 0;border-bottom:1px solid var(--border);color:var(--ink-2);font-size:12px;color-scheme:light}
.cmd-project{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cmd-project strong{color:var(--ink);font-weight:600}
.cmd-activity{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.cmd-activity label{flex:0 0 auto}
.cmd-activity select{min-width:0;width:100%;border:0;border-radius:6px;padding:5px 20px 5px 6px;background:var(--column);color:var(--ink);font:inherit;cursor:pointer;text-overflow:ellipsis}
.cmd-activity select:focus-visible{outline:2px solid var(--violet-300);outline-offset:1px}
.cmd-activity-picker{position:relative;flex:1;min-width:0}
.cmd .cmd-activity-picker summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;background:var(--column);color:var(--ink);cursor:pointer;list-style:none}
.cmd-activity-picker summary::-webkit-details-marker{display:none}
.cmd-activity-picker summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-activity-menu{position:absolute;bottom:calc(100% + 4px);left:0;right:0;z-index:10;padding:4px;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(30,27,75,.16)}
.cmd-project .cmd-activity-picker{width:125px}
.cmd .cmd-activity-menu button{display:block;width:100%;padding:7px 8px;border-radius:4px;background:transparent;color:var(--ink);text-align:left;font-size:12px;font-weight:400}
.cmd .cmd-activity-menu button:hover,.cmd .cmd-activity-menu button[aria-selected="true"]{background:var(--t-violet-bg);color:var(--violet)}
.cmd-activity-create{margin-top:4px;padding:8px 8px 4px;border-top:1px solid var(--border);color:var(--violet);font-size:12px;line-height:1.5}
.plan-scope{margin:0 0 10px;color:var(--ink-2);font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.cmd:focus-within{box-shadow:0 0 0 3px rgba(196,181,253,.6),0 14px 40px rgba(8,4,40,.45)}
.cmd .spark{color:var(--violet-500)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--ink)}
.cmd input::placeholder{color:var(--mute)}
.cmd button{border:0;background:var(--violet);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cmd button:hover{background:#8b4cf5}
.cmd button[type="submit"]:disabled{background:#E7E5EC;color:#9691A5;cursor:not-allowed}
.cmd button[type="submit"]:disabled:hover{background:#E7E5EC}
.decide{display:flex;align-items:center;gap:9px;border:0;background:var(--t-amber-bg);color:var(--t-amber);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 14px 40px rgba(8,4,40,.45)}
.decide b{display:grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--s-review);color:#fff;font-size:12.5px;padding:0 6px;font-variant-numeric:tabular-nums}
.decide:hover{background:#fdeaa8}

/* decisions sheet */
.sheet{position:absolute;left:calc(400px + (100% - 748px)/2);bottom:92px;transform:translateX(-50%);z-index:7;width:min(560px,calc(100% - 32px));background:var(--column);color:var(--ink);border-radius:16px;padding:10px;box-shadow:0 24px 70px rgba(8,4,40,.55)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.sheet-h .dt{width:8px;height:8px;border-radius:50%;background:var(--s-review)}
.sheet-h b{font-size:14px;font-weight:600}
.sheet-h span{font-size:12px;color:var(--mute)}
.x{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}
.drows{display:flex;flex-direction:column;gap:8px}
.drow{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--s-review);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;transition:opacity .3s,transform .3s}
.drow.out{opacity:0;transform:translateX(20px)}
.drow .tt{font-size:13.5px;font-weight:600}
.drow .imp{font-size:12px;color:var(--ink-2);margin-top:2px}
.drow .by{font-size:11.5px;color:var(--mute);margin-top:6px}
.decision-project{color:inherit;font:inherit}
.go{border:0;background:var(--violet);color:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.go:hover{background:#8b4cf5}
.clear{padding:14px 10px;color:var(--t-green);font-size:13px;font-weight:500}

/* plan */
.plan{position:absolute;left:32px;bottom:150px;z-index:4;width:336px;background:var(--card);color:var(--ink);border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(8,4,40,.45)}
.plan .ph{display:flex;align-items:center;gap:8px}
.plan .ph .dt{width:8px;height:8px;border-radius:50%;background:var(--s-run)}
.plan .ph b{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.plan .q{font-size:14px;font-weight:600;margin:8px 0 10px}
.plan ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--mute)}
.plan .ic{width:10px;height:10px;border-radius:50%;border:1.5px solid #cfcbe6;flex:none}
.plan li.run{color:var(--ink);font-weight:500}
.plan li.run .ic{border-color:var(--s-run);border-top-color:transparent;animation:spin .8s linear infinite}
.plan li.done{color:var(--ink-2)}
.plan li.done .ic{background:var(--s-done);border-color:var(--s-done)}
.plan li.gate{color:var(--t-amber);font-weight:500}
.plan li.gate .ic{background:var(--s-review);border-color:var(--s-review)}
@keyframes spin{to{transform:rotate(360deg)}}
.plan .cmp{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.plan .cmp b{font-weight:700;color:var(--ink)}
.plan .cmp .ag b{color:var(--violet);font-variant-numeric:tabular-nums}

/* hover tip + flying artifact */
.tip{position:absolute;z-index:4;width:230px;background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 14px 40px rgba(8,4,40,.45)}
.tip.on{opacity:1}
.tip .nm{font-weight:600;font-size:13.5px}
.tip p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.tip .tags{margin-top:8px}
#fly{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.flyer{position:absolute;left:0;top:0;width:150px;background:var(--card);border-radius:10px;padding:6px;display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center;color:var(--ink);font-size:11px;font-weight:600;box-shadow:0 10px 30px rgba(8,4,40,.5)}
.flyer .th{height:34px}
.flyer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* intro */
.intro{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 42%,var(--indigo-700),var(--indigo-900) 70%);display:grid;place-items:center;padding:24px 16px;transition:opacity .25s ease}
.intro.hide{opacity:0;pointer-events:none}
.intro-in{width:min(560px,100%);text-align:center}
.i-clock{font-weight:700;font-size:clamp(56px,11vw,104px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.i-bar{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin:20px auto 0;width:min(320px,80%);overflow:hidden}
.i-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet-500),var(--s-done))}
.i-line{min-height:3.2em;margin-top:22px;font-size:15px;color:var(--on-2);display:grid;place-items:center}
.i-line span{animation:rise .4s ease-out both}
.i-line b{color:var(--on);font-weight:600}
.i-line .prop{color:#fcd34d}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.i-skip{position:absolute;right:24px;bottom:22px;border:0;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--on-2);cursor:pointer}
.i-skip:hover{color:var(--on)}

@media (max-width:1100px){
  .side{right:0;bottom:auto;width:auto;background:none;border:0;box-shadow:none;padding:96px 24px 0;pointer-events:none}
  .legend{display:none}
  .flow{flex-direction:row;flex-wrap:wrap;gap:14px;border:0;margin-top:20px}
  .flow>div:not(.arr){display:block;padding:0;border:0}
  .flow .k{margin-top:5px}.flow .n{font-size:22px}
  .flow .arr{display:block;color:var(--on-3);padding-top:4px}
  .shelf{top:auto;bottom:150px;left:16px;right:16px;width:auto;height:auto;flex-direction:column;padding:10px}
  .stack{flex-direction:row;overflow-x:auto;mask-image:none;gap:8px;scrollbar-width:none}
  .stack .art{flex:0 0 250px}
  .bottom{left:16px;right:16px;bottom:16px}
  .sheet{left:50%;bottom:150px}
  .plan{left:16px;bottom:auto;top:270px}
}
@media (max-width:760px){
  .top{padding:14px 16px;gap:10px}
  .live{display:none}
  .side{padding:72px 16px 0}
  .flow{margin-top:14px;gap:10px}
  .flow .n{font-size:19px}
  .decide{width:100%;justify-content:center}
  .shelf{bottom:142px}
  .shelf .sub{display:none}
  .sheet,.shelf{z-index:7}
  .plan{top:auto;bottom:300px;right:16px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  const a=custom||ART[agId]||['doc','产出','Output','产出'];

function ago(d){ const s=(Date.now()-d)/1000; if(s<60) return P('刚刚','just now'); const m=Math.floor(s/60); return P(m+' 分钟前',m+'m ago'); }

  xfx(ag); wave(status==='done'); setTimeout(()=>wave(false),180);
  const a=custom||ART[agId];
  const land=()=>addArt(agId,status,true,custom);
  if(RM||!a){land();return;}
  const tgt=document.getElementById('stack').getBoundingClientRect();
  const el=document.createElement('div'); el.className='flyer';
  el.innerHTML=thumb(a[0])+`<span>${esc(P(a[1],a[2]))}</span>`;
  fly.appendChild(el);
  const sx=ag.x-20, sy=ag.y-50, tx=tgt.left+4, ty=tgt.top+4;
  const an=el.animate([
    {transform:`translate(${sx}px,${sy+20}px) scale(.3)`,opacity:0},
    {transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1,offset:.25},
    {transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1,offset:.4},
    {transform:`translate(${tx}px,${ty}px) scale(.9)`,opacity:.9,offset:.92},
    {transform:`translate(${tx}px,${ty}px) scale(.9)`,opacity:0}
  ],{duration:2000,easing:'cubic-bezier(.55,0,.25,1)'});
  an.onfinish=()=>{el.remove();land();};
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,cx=0,cy=0,R=0;
const RING={gate:.15,1:.4,2:.66,3:.92};
let cx0=0, TILT=.46, mx=.5, my=.5;
function layout(){
  DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR;
  if(W>1100){ const zone=W-400-348; cx0=400+zone/2; cy=H*.5; R=Math.min(zone*.36,H*.44,300); }
  else if(W>760){ cx0=W*.5; cy=H*.5; R=Math.min(W*.32,220); }
  else { cx0=W/2; cy=H*.47; R=Math.min(W*.4,170); }
  cx=cx0;
}
addEventListener('mousemove',e=>{mx=e.clientX/W;my=e.clientY/H;});
(function assign(){
  const ring=AG.filter(a=>a.id!=='orch'); const tot=ring.length+DOM.length*1.2; let a0=-Math.PI/2;
  DOM.forEach(d=>{
    const list=ring.filter(a=>a.dom===d.k), span=(list.length+1.2)/tot*Math.PI*2, pad=.6/tot*Math.PI*2;
    d.a0=a0; d.a1=a0+span;
    [1,2,3].forEach(m=>{ const lm=list.filter(a=>a.m===m); lm.forEach((a,i)=>{a.base=a0+pad+(i+.5)/lm.length*(span-2*pad);a.ring=m;}); });
    a0+=span;
  });
})();
/* inner rings spin faster: the closer to the human, the more back-and-forth */
const SPD={1:2.6,2:1.6,3:1};
function place(){
  TILT+=((.5+(my-.5)*.22)-TILT)*.04;            // the disc tilts with the mouse
  cx+=((cx0+(mx-.5)*-30)-cx)*.04;
  AG.forEach(a=>{ if(a.id==='orch'){a.x=cx;a.y=cy;a.z=0;return;}
    const g=a.base+S.rot*SPD[a.ring], r=RING[a.ring]*R; a.g=g; a.x=cx+Math.cos(g)*r; a.y=cy+Math.sin(g)*r*TILT; a.z=Math.sin(g); });
}
function gatePoint(g){ const a=g.ang+S.rot*3.4, r=RING.gate*R; return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r*TILT,z:Math.sin(a)}; }

const VX=[]; function newVx(init){ return {a:Math.random()*6.283, r:init?.25+Math.random()*2.5:2.3+Math.random()*.6, sp:.35+Math.random()*.65, big:Math.random()<.12, c:DOM[Math.floor(Math.random()*DOM.length)].c}; }

/* the XDIGATE mark: rounded violet plate with a glowing X; sx squashes it horizontally for the flip */
function drawX(x,y,size,alpha,flare,sx,now){
  const h=size/2, rr=size*.24;
  ctx.save(); ctx.translate(x,y); ctx.scale(sx,1); ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(167,139,250,.95)'; ctx.shadowBlur=30+30*flare;
  const pg=ctx.createLinearGradient(-h,-h,h,h); pg.addColorStop(0,'#a78bfa'); pg.addColorStop(1,'#6d28d9');
  ctx.fillStyle=pg; ctx.beginPath(); ctx.moveTo(-h+rr,-h); ctx.arcTo(h,-h,h,h,rr); ctx.arcTo(h,h,-h,h,rr); ctx.arcTo(-h,h,-h,-h,rr); ctx.arcTo(-h,-h,h,-h,rr); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // glossy top edge
  const gl=ctx.createLinearGradient(0,-h,0,0); gl.addColorStop(0,'rgba(255,255,255,.35)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl; ctx.fill();
  // the X
  const a=size*.27; ctx.lineCap='round'; ctx.strokeStyle='#fff'; ctx.lineWidth=size*.12;
  ctx.shadowColor='#fff'; ctx.shadowBlur=8+18*flare;
  ctx.beginPath(); ctx.moveTo(-a,-a); ctx.lineTo(a,a); ctx.moveTo(a,-a); ctx.lineTo(-a,a); ctx.stroke();
  // energy running along the strokes
  const t=(now/700)%1, ex=-a+2*a*t;
  ctx.shadowBlur=14; ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(ex,ex,size*.07,0,7); ctx.arc(-ex,ex,size*.07,0,7); ctx.fill();
  ctx.restore();
}

/* a small X flashes on the agent every time it ships an artifact */
const XFX=[]; function xfx(ag){ if(!RM && ag && ag.x!=null) XFX.push({ag,t:performance.now(),c:DC[ag.dom]||'#c4b5fd'}); }
function drawXfx(now){
  for(let i=XFX.length-1;i>=0;i--){
    const f=XFX[i], t=now-f.t; if(t>950){XFX.splice(i,1);continue;}
    const x=f.ag.x, y=f.ag.y, s=7+(t>520?(t-520)/430*4:0), fade=t<520?1:1-(t-520)/430;
    const p1=Math.min(1,t/150), p2=Math.max(0,Math.min(1,(t-120)/150));
    const seg=(x0,y0,x1,y1,p)=>{ if(p<=0) return; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+(x1-x0)*p,y0+(y1-y0)*p); ctx.stroke(); };
    ctx.save(); ctx.globalAlpha=fade; ctx.lineCap='round';
    ctx.strokeStyle=hexA(f.c,.5); ctx.lineWidth=4.5; ctx.shadowColor=f.c; ctx.shadowBlur=12;   // halo
    seg(x-s,y-s,x+s,y+s,p1); seg(x+s,y-s,x-s,y+s,p2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; ctx.shadowBlur=6;                               // bright core
    seg(x-s,y-s,x+s,y+s,p1); seg(x+s,y-s,x-s,y+s,p2);
    ctx.restore();
  }
}

/* the strike: two blades cut a giant X across the stage, flash, then collapse into the core */
function strike(){ S.strike=performance.now(); }
function drawStrike(now){
  if(!S.strike) return;
  const t=now-S.strike; if(t>1700){ S.strike=0; return; }
  const big=Math.min(W*.11,H*.15,R*.55), ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
  const shrink= t<1050 ? 1 : 1-ease((t-1050)/450)*.94;
  const L=big*shrink, fade= t<1250?1:1-(t-1250)/450;
  const blade=(x0,y0,x1,y1,p)=>{
    if(p<=0) return; const xe=x0+(x1-x0)*p, ye=y0+(y1-y0)*p;
    const g=ctx.createLinearGradient(x0,y0,xe,ye); g.addColorStop(0,'rgba(196,181,253,0)'); g.addColorStop(.7,'rgba(221,214,254,.9)'); g.addColorStop(1,'#fff');
    ctx.strokeStyle=g; ctx.lineCap='round';
    ctx.shadowColor='#a78bfa'; ctx.shadowBlur=40; ctx.lineWidth=Math.max(3,L*.045); ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xe,ye); ctx.stroke();
    ctx.shadowBlur=0; ctx.lineWidth=Math.max(1.5,L*.012); ctx.strokeStyle='#fff'; ctx.stroke();
    if(p<1){ ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=30; ctx.beginPath(); ctx.arc(xe,ye,Math.max(3,L*.02),0,7); ctx.fill(); ctx.shadowBlur=0; }
  };
  ctx.save(); ctx.globalAlpha=fade;
  blade(cx-L,cy-L*.82,cx+L,cy+L*.82, ease(t/330));
  blade(cx+L,cy-L*.82,cx-L,cy+L*.82, ease((t-300)/330));
  // flash when the X is complete
  if(t>630&&t<1100){ const k=1-(t-630)/470; const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,big*1.2); fg.addColorStop(0,`rgba(237,233,254,${.55*k})`); fg.addColorStop(1,'rgba(124,58,237,0)'); ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); }
  ctx.restore();
  if(t>1050&&!S.strikeWave){ S.strikeWave=1; wave(true); setTimeout(()=>wave(false),160); setTimeout(()=>wave(false),320); }
  if(t<1050) S.strikeWave=0;
}

  S.flows++; let i=0; A[steps[0]].act=performance.now()+1200;

    if(i>=steps.length-1){
      S.flows--; const ag=A[steps[i]]; S.hand+=1+Math.random()*3;

function renderPlan(){

function runCommand(q){
  q=q.trim(); if(!q) return;
  const plan=PLANS.find(p=>p.re.test(q))||DEF;
  const project=document.getElementById('cmdProject').textContent,campaignId=document.getElementById('cmdActivity').value;
  planState={q,plan,project,campaignId,state:{},elapsed:0,running:true,gate:false}; renderPlan();
  A.orch.act=performance.now()+2000; let i=0;
  const next=()=>{
    if(!planState||planState.q!==q) return;
    if(i>=plan.steps.length){
      planState.gate=true; planState.running=false; renderPlan();
      flyArt(A.orch,'orch','review',['deck',plan.zh,plan.en,'产出包']);
      addDecision({ag:'orch',project,campaignId,zh:plan.zh,en:plan.en,izh:plan.izh,ien:plan.ien}); return;
    }
    const id=plan.steps[i], idx=i; planState.state[idx]='run'; renderPlan();
    sendPacket(()=>A.orch,()=>A[id],DC[A[id].dom],()=>{
      A[id].act=performance.now()+1500;
      setTimeout(()=>{ if(!planState||planState.q!==q) return; planState.state[idx]='done'; renderPlan(); flyArt(A[id],id,'ops'); i++; next(); },RM?100:1000);
    },750);
  };
  next();
}

const eo=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function draw(now,dt){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{ctx.globalAlpha=.16+.16*Math.sin(now/1400+s.p);ctx.fillStyle='#e9e5ff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  const ap=Math.min(1,(now-S.appear)/1400);
  const E=(r)=>{ctx.beginPath();ctx.ellipse(cx,cy,r,r*TILT,0,0,7);};
  // disc floor
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,TILT);
  let fg=ctx.createRadialGradient(0,0,0,0,0,R*1.08);fg.addColorStop(0,'rgba(139,92,246,.30)');fg.addColorStop(.6,'rgba(124,58,237,.10)');fg.addColorStop(1,'rgba(124,58,237,0)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,R*1.08,0,7);ctx.fill();ctx.restore();
  // incoming signals (behind the disc), drawn additively so halos glow
  ctx.save(); ctx.globalCompositeOperation='lighter';
  VX.forEach(v=>{
    const dr=.0002*v.sp*(1+.5/v.r), da=.00075*v.sp/Math.max(.35,v.r);   // per ms: inward pull, gentle swirl
    v.r-=dt*dr; v.a+=dt*da;
    if(v.r<.06){ Object.assign(v,newVx(false)); return; }
    const back=170+110*v.sp;                                // tail = where the star was a moment ago
    const x=cx+Math.cos(v.a)*v.r*R, y=cy+Math.sin(v.a)*v.r*R*TILT, x2=cx+Math.cos(v.a-da*back)*(v.r+dr*back)*R, y2=cy+Math.sin(v.a-da*back)*(v.r+dr*back)*R*TILT;
    const al=Math.min(1,(3-v.r)*.7)*Math.min(1,v.r*3)*.55*ap; if(al<=.02) return;
    const tg=ctx.createLinearGradient(x2,y2,x,y); tg.addColorStop(0,hexA(v.c,0)); tg.addColorStop(.75,hexA(v.c,.7)); tg.addColorStop(1,hexA(v.c,.9));
    ctx.globalAlpha=al; ctx.lineCap='round';
    ctx.strokeStyle=hexA(v.c,.25); ctx.lineWidth=v.big?5:3.5; ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x,y);ctx.stroke();   // halo around the tail
    ctx.strokeStyle=tg; ctx.lineWidth=v.big?1.8:1.2; ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x,y);ctx.stroke();
    const hr=v.big?6:4, hg=ctx.createRadialGradient(x,y,0,x,y,hr); hg.addColorStop(0,'rgba(255,255,255,.4)'); hg.addColorStop(.4,hexA(v.c,.3)); hg.addColorStop(1,hexA(v.c,0));
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(x,y,hr,0,7); ctx.fill();
  });
  ctx.restore(); ctx.globalAlpha=1;
  // rings
  [['gate','#f59e0b',.7],[1,'#c4b5fd',.28],[2,'#c4b5fd',.2],[3,'#c4b5fd',.14]].forEach(([k,c,al],i)=>{
    const r=RING[k]*R*eo(ap*1.3-i*.08); if(r<=0) return;
    ctx.save();ctx.strokeStyle=c;ctx.globalAlpha=al;ctx.lineWidth=k==='gate'?1.4:1;ctx.setLineDash(k==='gate'?[3,5]:[2,6]);ctx.lineDashOffset=-now/(k==='gate'?30:60);E(r);ctx.stroke();ctx.restore();
  });
  // shockwaves
  for(let i=WAVES.length-1;i>=0;i--){ const w=WAVES[i], k=(now-w.t)/1400; if(k>=1){WAVES.splice(i,1);continue;}
    ctx.save();ctx.strokeStyle='#c4b5fd';ctx.globalAlpha=(1-k)*.7*w.s;ctx.lineWidth=2.5*(1-k)+.5;E(R*(.1+k*1.15));ctx.stroke();ctx.restore(); }
  // core: beam + body
  const pulse=1+.07*Math.sin(now/300)+(A.orch.act>now?.15:0), cr=Math.max(12,R*.075)*pulse*eo(ap);
  const drawCore=()=>{
    const bh=R*.95; const bg=ctx.createLinearGradient(0,cy-bh,0,cy);bg.addColorStop(0,'rgba(196,181,253,0)');bg.addColorStop(1,'rgba(196,181,253,'+(.22+.1*Math.sin(now/260))+')');
    ctx.fillStyle=bg;ctx.fillRect(cx-cr*.35,cy-bh,cr*.7,bh);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cr*3.6);g.addColorStop(0,'rgba(139,92,246,.75)');g.addColorStop(1,'rgba(139,92,246,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,cr*3.6,0,7);ctx.fill();
    const fk=Math.min(1,(now-(S.flip||-1e9))/700), flip=Math.cos(fk*Math.PI*2);   // one full flip after each delivery
    drawX(cx,cy,cr*1.3,1,A.orch.act>now?1:.5+.25*Math.sin(now/300),Math.abs(flip)<.08?.08*Math.sign(flip||1):flip,now);
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(cx,cy,cr*1.5,cr*1.5*TILT,0,now/400,now/400+4);ctx.stroke();
    ctx.strokeStyle='rgba(196,181,253,.45)';ctx.beginPath();ctx.ellipse(cx,cy,cr*1.9,cr*1.9*TILT,0,-now/550,-now/550+3);ctx.stroke();
  };
  // nodes, back to front
  const nodes=AG.filter(a=>a.id!=='orch').sort((p,q)=>p.z-q.z);
  const gates=S.gate.map((gi,i)=>({gi,i,p:gatePoint(gi)}));
  const drawGate=o=>{const s=(3.5+1.5*(o.p.z+1)/2)*eo((now-o.gi.born)/600)*(1+.3*Math.sin(now/220+o.i));
    ctx.save();ctx.shadowColor='#f59e0b';ctx.shadowBlur=16;ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(o.p.x,o.p.y,s,0,7);ctx.fill();ctx.restore();};
  const drawNode=(a,i)=>{
    const k=eo((now-S.appear-300-AG.indexOf(a)*25)/700); if(k<=0) return;
    const c=DC[a.dom], on=a.act>now, hv=hover===a, f=.75+.45*(a.z+1)/2, depthA=.72+.28*(a.z+1)/2;
    const r=(a.st==='live'?6.2:4.6)*f*k*(hv?1.4:1);
    a.label+=((on||hv?1:0)-a.label)*Math.min(1,dt/180);
    // orbit trail = velocity
    if(a.st==='live'){ ctx.strokeStyle=c;ctx.lineWidth=1.6*f; const rr=RING[a.ring]*R, span=.32*SPD[a.ring];
      for(let j=0;j<8;j++){ const g0=a.g-span*(j+1)/8, g1=a.g-span*j/8; ctx.globalAlpha=(1-j/8)*.5*depthA*k; ctx.beginPath(); ctx.moveTo(cx+Math.cos(g0)*rr,cy+Math.sin(g0)*rr*TILT); ctx.lineTo(cx+Math.cos(g1)*rr,cy+Math.sin(g1)*rr*TILT); ctx.stroke(); } }
    if(on){const gg=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,24*f);gg.addColorStop(0,hexA(c,.6));gg.addColorStop(1,hexA(c,0));ctx.globalAlpha=1;ctx.fillStyle=gg;ctx.beginPath();ctx.arc(a.x,a.y,24*f,0,7);ctx.fill();}
    // soft halo under every agent
    const hg=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,r*3.2); hg.addColorStop(0,hexA(c,a.st==='live'?.45:.2)); hg.addColorStop(1,hexA(c,0));
    ctx.globalAlpha=depthA*k; ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(a.x,a.y,r*3.2,0,7); ctx.fill();
    ctx.globalAlpha=(on||hv?1:depthA)*k;
    if(a.st==='live'){ctx.fillStyle=c;ctx.beginPath();ctx.arc(a.x,a.y,r,0,7);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.4;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(a.x-r*.3,a.y-r*.3,r*.3,0,7);ctx.fill();}
    else{ctx.strokeStyle=c;ctx.lineWidth=1.6;if(a.st==='plan')ctx.setLineDash([1.5,2.5]);ctx.beginPath();ctx.arc(a.x,a.y,r,0,7);ctx.stroke();ctx.setLineDash([]);}
    ctx.globalAlpha=1;
  };
  nodes.filter(a=>a.z<0).forEach(drawNode); gates.filter(o=>o.p.z<0).forEach(drawGate);
  drawCore();
  gates.filter(o=>o.p.z>=0).forEach(drawGate); nodes.filter(a=>a.z>=0).forEach(drawNode);
  // labels on top
  AG.forEach(a=>{ if(a.id==='orch'||a.label<=.02) return;
    const txt=nm(a.id); ctx.font='600 11px "Inter","Noto Sans SC",sans-serif'; const w=ctx.measureText(txt).width+12, ly=a.y-28;
    ctx.globalAlpha=a.label; ctx.fillStyle='#ffffff'; roundRect(a.x-w/2,ly,w,18,6); ctx.fill();
    ctx.beginPath();ctx.moveTo(a.x-4,ly+18);ctx.lineTo(a.x+4,ly+18);ctx.lineTo(a.x,ly+23);ctx.fill();
    ctx.fillStyle='#1e1b4b'; ctx.textAlign='center'; ctx.fillText(txt,a.x,ly+12.5); ctx.globalAlpha=1; });
  ctx.fillStyle='#fff';ctx.font='600 12px "Inter","Noto Sans SC",sans-serif';ctx.textAlign='center';ctx.globalAlpha=ap;ctx.fillText(nm('orch'),cx,cy+cr+18);ctx.globalAlpha=1;
  if(R>150){ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='500 11px "Inter","Noto Sans SC",sans-serif';ctx.textAlign='center';
    ctx.fillText(P('M1 → M3 · 越往外越自主','M1 → M3 · further out, more autonomous'),cx,cy+RING[3]*R*TILT+30);}
  // packets
  for(let i=S.packets.length-1;i>=0;i--){
    const p=S.packets[i]; p.t+=dt/p.dur; const a=p.from(), b=p.to();
    const mx2=(a.x+b.x)/2,my2=(a.y+b.y)/2,qx=mx2+(cx-mx2)*.4,qy=my2+(cy-R*.35-my2)*.5,e=eio(Math.min(1,p.t));
    const x=(1-e)*(1-e)*a.x+2*(1-e)*e*qx+e*e*b.x, y=(1-e)*(1-e)*a.y+2*(1-e)*e*qy+e*e*b.y;
    p.trail.push([x,y]); if(p.trail.length>16) p.trail.shift();
    ctx.strokeStyle=p.color;ctx.lineCap='round';
    for(let j=1;j<p.trail.length;j++){ctx.globalAlpha=j/p.trail.length*.9;ctx.lineWidth=j/p.trail.length*3;ctx.beginPath();ctx.moveTo(...p.trail[j-1]);ctx.lineTo(...p.trail[j]);ctx.stroke();}
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.shadowColor=p.color;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill();ctx.shadowBlur=0;
    if(p.t>=1){S.packets.splice(i,1);p.done&&p.done();}
  }
  drawXfx(now);
  drawStrike(now);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  const ov=document.getElementById('intro'), line=document.getElementById('iLine'); ov.classList.remove('hide'); line.innerHTML='';
  const span=10*60+45, dur=RM?10:1400, t0=performance.now(); let shown=-1;
  const tick=()=>{
    const k=Math.min(1,(performance.now()-t0)/dur), m=Math.floor(span*eio(k)), tot=(22*60+m)%1440;
    document.getElementById('iClock').textContent=String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
    document.getElementById('iBar').style.width=k*100+'%';
    let idx=-1; EVENTS.forEach((e,i)=>{if(e[0]<=m) idx=i;});

    if(k<1) iRaf=requestAnimationFrame(tick); else setTimeout(endIntro,RM?0:100);
  };

}

/* ---------- loop ---------- */
let last=performance.now(), nextFlow=0, numT=0, shelfT=0;
function loop(now){
  const dt=Math.min(64,now-last); last=now;
  S.rot+=dt*(RM?0:.00011); place(); draw(now,dt);
  S.sig+=dt*(.004+Math.random()*.005);
  const introOn=!document.getElementById('intro').classList.contains('hide');
  if(!introOn&&now>nextFlow){ if(S.flows<4&&!(planState&&planState.running)) runFlow(FLOWS[Math.floor(Math.random()*FLOWS.length)]); nextFlow=now+(RM?6000:900+Math.random()*1200); }
  if(planState&&planState.running) planState.elapsed+=dt/1000*18;
  if(now-numT>300){ numT=now;
    document.getElementById('n0').textContent=Math.round(S.sig).toLocaleString('en-US');
    document.getElementById('n1').textContent=Math.round(S.hand).toLocaleString('en-US');
    document.getElementById('runN').textContent=Math.max(1,AG.filter(a=>a.act>now).length+S.flows);
    if(planState&&planState.running) renderPlan();
  }
  if(now-shelfT>30000){ shelfT=now; renderShelf(); }
  requestAnimationFrame(loop);
}
