<style data-source="css/01-foundation-shell.css">
:root{
  /* ── type scale · 7 steps (was 32 sizes) ── */
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px;
  --fs-xl:18px; --fs-2xl:24px; --fs-3xl:32px;
  /* ── spacing · 6 steps (was 28 values) ── */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* ── semantic colour · naming what already existed ── */
  --surface-tint:#FCFBFF; --hairline:#F4F2FB;
  --danger-bg:#FEF2F2; --danger-bd:#FECACA; --danger-fg:#B91C1C; --danger-fg-strong:#991B1B;
  --warn-bg:#FFFBEB; --warn-bd:#FDE68A; --warn-fg:#B45309;
  --ok-bg:#ECFDF5; --ok-fg:#047857;
  --primary-tint:#F5F3FF; --primary-bd:#C4B5FD;
  --orange-bg:#FFF7ED; --orange-fg:#C2410C;
  --sidebar-w:248px;

  --sb:#190C58;--sb2:#241480;
  --primary:#7C3AED;--primary-h:#6D28D9;--primary-lt:#A78BFA;--primary-bg:#EDE9FE;
  --gold:#F59E0B;--green:#10B981;--red:#EF4444;--blue:#3B82F6;--teal:#14B8A6;
  --surface:#fff;--bg:#F3F1FC;--border:#E5E0F8;
  --t1:#1E1440;--t2:#5B5585;--t3:#9490B8;
  --sb-t:#CFC6F0;--sb-tm:#8B7FC7;--sb-active:rgba(167,139,250,.18);
  --sh-sm:0 1px 4px rgba(100,80,180,.08);--sh-md:0 4px 20px rgba(100,80,180,.13);--sh-lg:0 12px 44px rgba(60,30,140,.24);
  --r:12px;--r-sm:8px;--sbw:228px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:var(--fs-md);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--primary-bg)}
.num{font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#sb{width:var(--sbw);flex:0 0 var(--sbw);background:var(--sb);display:flex;flex-direction:column;padding:var(--sp-4) 12px;gap:var(--sp-1)}
.brand{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 8px 18px}
.brand-m{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary-lt),var(--primary));display:grid;place-items:center;flex:0 0 auto}
.brand-n{font-family:'Sora';font-weight:700;font-size:var(--fs-lg);color:#fff;letter-spacing:.14em}
.brand-s{font-size:var(--fs-xs);color:var(--sb-tm);letter-spacing:.22em;font-family:'Sora'}
.nv{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 10px;border-radius:var(--r-sm);color:var(--sb-t);font-size:var(--fs-md);width:100%;text-align:left;transition:background .12s,color .12s}
.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nv.on{background:var(--sb-active);color:#fff;font-weight:500}
.nv svg{flex:0 0 16px;opacity:.85}
.nv .bdg{margin-left:auto;font-family:'Sora';font-size:var(--fs-xs);font-weight:600;background:rgba(255,255,255,.14);padding:var(--sp-1) 6px;border-radius:20px;color:#fff}
.nv.on .bdg{background:var(--primary)}
.nv-div{height:1px;background:rgba(255,255,255,.09);margin:var(--sp-2) 10px}
.account-wrap{margin-top:auto;position:relative}
.account-panel{display:grid;gap:var(--sp-1);padding:var(--sp-1);border:1px solid rgba(255,255,255,.26);border-radius:8px;background:#fff;box-shadow:0 12px 28px rgba(18,8,64,.18)}
.account-panel button{width:100%;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);border-radius:6px;text-align:left;color:var(--t1);transition:background .12s,color .12s}
.account-panel button:hover{background:#F5F1FF}
.account-panel button.on{background:#ECE7FF;color:#160B4C}
.account-panel b{display:block;font-size:var(--fs-md);line-height:1.2}
.account-panel .meta{display:block;font-size:var(--fs-xs);color:var(--t3);line-height:1.25;font-weight:500}
.account-demo-note{margin:var(--sp-1) var(--sp-2) 0;padding:var(--sp-2) 0 var(--sp-1);border-top:1px solid var(--hairline);color:#9B93B7;font-size:10px;line-height:1.45;font-weight:500}
.sb-b{width:100%;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 8px;border-radius:var(--r-sm);background:rgba(255,255,255,.05);text-align:left;transition:.14s}
.sb-b:hover{background:rgba(255,255,255,.09)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,#7C3AED);display:grid;place-items:center;color:#fff;font-family:'Sora';font-size:var(--fs-xs);font-weight:600;flex:0 0 auto}
.sb-b .n{font-size:var(--fs-sm);color:#fff;line-height:1.3}
.sb-b .r{font-size:var(--fs-xs);color:var(--sb-tm)}
.account-chev{margin-left:auto;color:var(--sb-tm)}
.account-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);padding:var(--sp-1);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-lg);z-index:120}
.account-menu button{width:100%;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);border-radius:8px;text-align:left;color:var(--t1)}
.account-menu button:hover,.account-menu button.on{background:var(--primary-bg)}
.account-menu .meta{display:block;font-size:var(--fs-xs);color:var(--t3);line-height:1.25}

#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{height:56px;flex:0 0 56px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--sp-3);padding:0 20px;z-index:40}
.compose{flex:1;max-width:520px;display:flex;align-items:center;gap:var(--sp-2);height:36px;padding:0 13px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--t3);font-size:var(--fs-md);transition:border-color .15s,background .15s}
.compose:hover{border-color:var(--primary-lt);background:#fff}
.compose .k{margin-left:auto;font-family:'Sora';font-size:var(--fs-xs);border:1px solid var(--border);padding:var(--sp-1) 5px;border-radius:4px;color:var(--t3)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)}
.appr{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 12px;border-radius:18px;background:#FEF3C7;color:#92400E;font-size:var(--fs-sm);font-weight:500}
.appr .c{font-family:'Sora';font-weight:700;background:var(--gold);color:#fff;border-radius:14px;padding:0 6px;font-size:var(--fs-xs);min-width:18px;text-align:center}
.proj{display:flex;align-items:center;gap:var(--sp-2);height:32px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:var(--fs-sm)}
.proj .l{font-size:var(--fs-xs);color:var(--t3);letter-spacing:.06em}
.proj .v{font-family:'Sora';font-weight:600;font-size:var(--fs-sm)}

#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-5) 28px 80px}
.eyebrow{font-family:'Sora';font-size:var(--fs-xs);font-weight:600;letter-spacing:.16em;color:var(--primary);text-transform:uppercase;margin-bottom:var(--sp-2)}
h1{font-family:'Sora';font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--t2);font-size:var(--fs-md);margin-top:var(--sp-1);max-width:640px}


/* ── keyboard focus · was 5 rules across 686 classes ── */
:where(button,a,input,textarea,select,[tabindex],[role="button"],[role="tab"],[role="option"]):focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
:where(button,a,input,textarea,select,[tabindex]):focus:not(:focus-visible){outline:none}
/* ── reduced motion · was 1 rule ── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* 看整页 · whole-page preview */
.mbox.whole-page{max-width:560px;width:92vw;display:flex;flex-direction:column;max-height:88vh}
.whole-page-stage{overflow-y:auto;background:var(--hairline);padding:var(--sp-3);display:flex;flex-direction:column;gap:0;flex:1}
.wp-screen{position:relative;background:var(--surface);min-height:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wp-screen img{width:100%;height:auto;display:block;flex:0 0 auto}
.wp-screen.gen{min-height:180px}
.wp-lab{position:absolute;bottom:var(--sp-2);left:var(--sp-2);z-index:2;background:rgba(30,20,64,.72);color:#fff;
  font-size:var(--fs-xs);border-radius:6px;padding:3px var(--sp-2)}
.wp-pending{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);color:var(--t3);font-size:var(--fs-sm);padding:var(--sp-6) 0}
.whole-page .kp-dialog-foot>span:last-child{display:flex;gap:var(--sp-2)}
/* 抽屉加宽 · a labelled control, not a mystery icon */
.dw-expand-toggle{display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 10px;border-radius:7px;
  background:var(--primary-bg);color:var(--primary-h);border:1px solid transparent;
  font-size:var(--fs-xs);font-weight:600;white-space:nowrap;flex:0 0 auto;transition:.13s;margin-left:auto}
.dw-expand-toggle svg{width:14px;height:14px;flex:0 0 14px}
.dw-expand-toggle:hover{background:var(--primary-tint);border-color:var(--primary-bd)}
#dw.expanded .dw-expand-toggle{background:var(--primary);color:#fff}
#dw.expanded .dw-expand-toggle:hover{background:var(--primary-h)}
@media(max-width:980px){.dw-expand-toggle span{display:none}.dw-expand-toggle{padding:0;width:29px;justify-content:center}}

</style>
<style data-source="css/02-work-thread-artifacts.css">
/* ---------- controls ---------- */
.bar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-4) 0 16px}
.seg{display:inline-flex;background:#EAE5FA;border-radius:9px;padding:var(--sp-1);gap:var(--sp-1)}
.seg button{padding:var(--sp-1) 13px;border-radius:6px;font-size:var(--fs-sm);color:var(--t2);transition:.13s;white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:var(--sh-sm)}
.fl{display:inline-flex;align-items:center;gap:var(--sp-1);height:30px;padding:0 11px;border:1px solid var(--border);background:#fff;border-radius:16px;font-size:var(--fs-sm);color:var(--t2);transition:.13s}
.fl:hover{border-color:var(--primary-lt);color:var(--t1)}
.fl.on{background:var(--primary-bg);border-color:var(--primary-lt);color:var(--primary-h);font-weight:500}
.fwrap{position:relative;display:inline-block}
.fmenu{position:absolute;top:calc(100% + 5px);left:0;z-index:30;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-md);padding:var(--sp-1);min-width:150px;max-height:260px;overflow-y:auto;display:flex;flex-direction:column}
.fmenu button{padding:var(--sp-2) 10px;border-radius:6px;font-size:var(--fs-sm);text-align:left;white-space:nowrap;color:var(--t2)}
.fmenu button:hover{background:var(--bg);color:var(--t1)}
.fmenu button.on{background:var(--primary-bg);color:var(--primary-h);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:34px;padding:0 15px;border-radius:var(--r-sm);background:var(--primary);color:#fff;font-size:var(--fs-md);font-weight:500;white-space:nowrap;flex:0 0 auto;box-shadow:0 2px 10px rgba(124,58,237,.28);transition:.14s}
.btn:hover{background:var(--primary-h);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--t1);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--primary-lt);background:#fff}
.btn.sm{height:29px;padding:0 12px;font-size:var(--fs-sm)}
.spacer{margin-left:auto}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) 8px;border-radius:6px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap;line-height:1.7}
.chip.camp{background:var(--orange-bg);color:var(--orange-fg);border:1px solid #FFEDD5}
.chip.dom{background:var(--primary-tint);color:var(--primary-h);border:1px solid #E9E3FE}
.chip.plat{background:#FFF1F2;color:#BE123C;border:1px solid #FFE4E6}
.chip.mut{background:var(--hairline);color:var(--t2);border:1px solid var(--border)}
.chip.lv{background:var(--ok-bg);color:var(--ok-fg);border:1px solid #D1FAE5;font-family:'Sora';font-weight:600}
.st{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) 9px;border-radius:20px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap}
.st::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.st.todo{background:var(--hairline);color:#6B6494}
.st.run{background:#EFF6FF;color:#1D4ED8}
.st.review{background:var(--warn-bg);color:var(--warn-fg)}
.st.done{background:var(--ok-bg);color:var(--ok-fg)}
.st.hold{background:var(--danger-bg);color:var(--danger-fg)}
.st.ask{background:var(--primary-tint);color:#6D28D9}
.st.ask::before{animation:blink 1.4s ease-in-out infinite}
.st.run::before{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);align-items:start}
.kcol{background:rgba(255,255,255,.5);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-3);min-height:180px}
.kh{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 4px 11px}
.kh .t{font-size:var(--fs-sm);font-weight:600}
.kh .n{font-family:'Sora';font-size:var(--fs-xs);font-weight:600;color:var(--t3);background:#fff;border:1px solid var(--border);border-radius:12px;padding:0 7px}
.kh .dot{width:7px;height:7px;border-radius:50%}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:var(--sp-3);margin-bottom:var(--sp-2);cursor:pointer;transition:.15s;text-align:left;width:100%;display:block}
.kcard:hover{border-color:var(--primary-lt);box-shadow:var(--sh-md);transform:translateY(-2px)}
.kcard .tt{font-size:var(--fs-md);font-weight:500;line-height:1.45;margin-bottom:var(--sp-2)}
.kcard .meta{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.kcard .ft{display:flex;align-items:center;gap:var(--sp-2);padding-top:var(--sp-2);border-top:1px solid #F1EEFB;font-size:var(--fs-xs);color:var(--t3)}
.arts{display:flex;gap:var(--sp-1)}
.ai{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:var(--fs-xs);background:var(--primary-bg);color:var(--primary-h)}
.prog{height:3px;background:#EDE9FE;border-radius:2px;overflow:hidden;margin-bottom:var(--sp-2)}
.prog i{display:block;height:100%;background:var(--blue);border-radius:2px;animation:grow 2.6s ease-in-out infinite}
@keyframes grow{0%,100%{opacity:.65}50%{opacity:1}}

/* ---------- list ---------- */
.dgrp{margin-bottom:var(--sp-5)}
.dgh{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);padding-left:var(--sp-1)}
.dgh .d{font-family:'Sora';font-size:var(--fs-sm);font-weight:600;letter-spacing:.05em;color:var(--t2)}
.dgh .ln{flex:1;height:1px;background:var(--border)}
.dgh .n{font-family:'Sora';font-size:var(--fs-xs);color:var(--t3)}
.row{display:flex;align-items:center;gap:var(--sp-3);background:#fff;border:1px solid var(--border);border-radius:10px;padding:var(--sp-3) 14px;margin-bottom:var(--sp-2);cursor:pointer;transition:.13s;width:100%;text-align:left}
.row:hover{border-color:var(--primary-lt);box-shadow:var(--sh-sm);transform:translateX(2px)}
.row .tt{font-size:var(--fs-md);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{display:flex;align-items:center;gap:var(--sp-1);flex:0 0 auto}
.row .ag{font-size:var(--fs-xs);color:var(--t3);width:112px;flex:0 0 112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .up{font-size:var(--fs-xs);color:var(--t3);width:66px;flex:0 0 66px;text-align:right;font-family:'Sora'}
.empty{text-align:center;padding:var(--sp-6) 20px;color:var(--t3)}
.empty .h{font-family:'Sora';font-size:var(--fs-lg);font-weight:600;color:var(--t2);margin-bottom:var(--sp-1)}

/* ---------- thread ---------- */
.th-hd{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-4) 22px;margin-bottom:var(--sp-4)}
.crumb{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--t3);margin-bottom:var(--sp-3)}
.crumb button{color:var(--primary);font-size:var(--fs-xs)}
.crumb button:hover{text-decoration:underline}
.th-hd h2{font-family:'Sora';font-size:var(--fs-xl);font-weight:700;letter-spacing:-.015em;line-height:1.3}
.th-meta{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-3)}
.th-stats{display:flex;gap:var(--sp-5);margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid #F1EEFB}
.ts .l{font-size:var(--fs-xs);color:var(--t3);letter-spacing:.04em;margin-bottom:var(--sp-1)}
.ts .v{font-family:'Sora';font-size:var(--fs-md);font-weight:600}

/* spine */
.spine{position:relative;padding-left:var(--sp-6)}
.spine::before{content:'';position:absolute;left:11px;top:6px;bottom:34px;width:2px;background:linear-gradient(180deg,var(--border),var(--border) 70%,transparent)}
.node{position:relative;margin-bottom:var(--sp-4)}
.node::before{content:'';position:absolute;left:-32px;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--border);z-index:2}
.node.ok::before{background:var(--green);border-color:var(--green)}
.node.act::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px rgba(59,130,246,.16);animation:pulse 1.8s ease-in-out infinite}
.node.wait::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(245,158,11,.15)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(59,130,246,.16)}50%{box-shadow:0 0 0 9px rgba(59,130,246,.05)}}
.nlab{display:flex;align-items:center;gap:var(--sp-2);font-family:'Sora';font-size:var(--fs-xs);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);margin-bottom:var(--sp-2)}
.bub{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-3) 16px;font-size:var(--fs-md)}
.bub.me{background:linear-gradient(180deg,#FBFAFF,#F7F5FE);border-color:#E9E3FE}
.who{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);font-size:var(--fs-xs);color:var(--t2)}
.who .nm{font-weight:600;color:var(--t1);font-size:var(--fs-sm)}
.agent-run-hit{width:calc(100% + 16px);margin:-6px -8px 8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .15s ease,box-shadow .15s ease}
.agent-run-hit:hover{background:var(--primary-tint)}
.agent-run-hit:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.who .tm{margin-left:auto;font-size:var(--fs-xs);color:var(--t3);font-family:'Sora'}
.avs{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:600;color:#fff;font-family:'Sora';flex:0 0 22px}

/* plan steps */
.pstep{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-2) 0;border-top:1px solid var(--hairline)}
.pstep:first-of-type{border-top:0;padding-top:var(--sp-1)}

.kp-summary{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--t3);margin-bottom:var(--sp-2);min-height:18px}

.kp-scroll{max-height:min(560px,60vh);overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff;scrollbar-width:thin;scrollbar-color:#CDC6E7 #FAF9FF}

.kp-url-wrap{position:relative;display:flex;align-items:center;gap:6px;min-width:0;min-height:30px;padding:var(--sp-1) 5px;border:1px solid transparent;border-radius:4px}

@media(max-width:620px){.seo-keyword-grid{grid-template-columns:1fr}.seo-meta-item.wide{grid-column:auto}}
.note{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:var(--r-sm);padding:var(--sp-3) 13px;font-size:var(--fs-sm);color:#92400E;line-height:1.6}
.seo-faq-item{padding:var(--sp-3) 14px;margin-bottom:var(--sp-2);border:1px solid var(--border);border-radius:8px;background:#fff;text-align:left}
.seo-faq-line{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--sp-1);align-items:start;color:var(--t2);font-size:var(--fs-sm);line-height:1.65;text-align:left}
.seo-faq-line+.seo-faq-line{margin-top:var(--sp-1)}
.seo-faq-line b{color:var(--t1);font-weight:700}
.seo-faq-mark{color:var(--primary);font-weight:600}

/* source */
.seo-intake-summary{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-1);width:100%;padding:var(--sp-3) 14px;border:0;background:#fff;text-align:left;color:var(--t2);font:inherit;font-size:var(--fs-sm);line-height:1.6;cursor:pointer}
.seo-intake-verdict{display:flex;align-items:center;gap:var(--sp-2);color:var(--t1);font-size:var(--fs-md)}
.seo-intake-stats{font-size:var(--fs-xs);color:var(--t3)}
.seo-intake-panel{display:flex;flex-direction:column;gap:var(--sp-3)}
.seo-intake-hero{padding:var(--sp-3) 14px;border:1px solid #A7F3D0;border-radius:var(--r-sm);background:#ECFDF5}
.seo-intake-hero p{margin:var(--sp-2) 0 0;color:#34665A;font-size:var(--fs-sm);line-height:1.7}
.seo-intake-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff}
.seo-intake-metrics div{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-3) 13px;border-top:1px solid #F0EDF9}
.seo-intake-metrics div:nth-child(-n+2){border-top:0}.seo-intake-metrics div:nth-child(odd){border-right:1px solid #F0EDF9}
.seo-intake-metrics span,.seo-intake-market span{font-size:var(--fs-sm);color:var(--t3)}
.seo-intake-metrics b{color:var(--t1);font-size:var(--fs-lg)}
.seo-intake-market{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) 13px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;font-size:var(--fs-sm)}
.seo-results-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:var(--sp-2) 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;color:var(--primary-h);font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.seo-result-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff}
.seo-result-row{display:grid;grid-template-columns:36px minmax(0,1fr) 120px;gap:var(--sp-2);align-items:center;padding:var(--sp-2) 11px;border-top:1px solid #F0EDF9;font-size:var(--fs-xs);color:var(--t2)}
.seo-result-row:first-child{border-top:0}.seo-result-row span:nth-child(2){color:var(--t1);text-decoration:underline;text-underline-offset:2px;cursor:pointer;transition:color .14s}.seo-result-row span:nth-child(2):hover{color:var(--primary)}.seo-result-row span:last-child{text-align:right;color:var(--t3)}
@media(max-width:620px){.seo-intake-metrics{grid-template-columns:1fr}.seo-intake-metrics div:nth-child(-n+2){border-top:1px solid #F0EDF9}.seo-intake-metrics div:first-child{border-top:0}.seo-intake-metrics div:nth-child(odd){border-right:0}.seo-result-row{grid-template-columns:30px minmax(0,1fr)}.seo-result-row span:last-child{grid-column:2;text-align:left}}
.pcard.human{border-color:#BAE6FD}
.srcband{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 16px;background:#F0F9FF;border-bottom:1px solid #BAE6FD;font-size:var(--fs-xs);color:#0369A1;font-weight:500}
.srcband .ic{font-size:var(--fs-sm)}

/* reasoning */
.pcb{font-size:var(--fs-sm);color:var(--t2);line-height:1.75;padding:var(--sp-3) 16px 13px}
.rlab{font-family:'Sora';font-size:var(--fs-xs);font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--primary);margin-bottom:var(--sp-1)}
.rfoot{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px dashed var(--border)}
.rf{font-size:var(--fs-xs);color:var(--t3);line-height:1.6;flex:1;min-width:200px}
.rf b{color:var(--t2);font-weight:600}
.rf.alt{flex:0 0 auto;color:var(--primary);font-weight:500}
.rf.alt:hover{text-decoration:underline}
.reasoning{background:linear-gradient(180deg,#FBFAFF,#F7F5FE);border:1px solid #E9E3FE;border-radius:var(--r);padding:var(--sp-3) 16px}
.reasoning .rh{display:flex;align-items:center;gap:var(--sp-2);font-family:'Sora';font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-h);margin-bottom:var(--sp-3)}
.rstep{display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid rgba(124,58,237,.09);font-size:var(--fs-sm);line-height:1.7;color:var(--t2)}
.rstep.last{border-bottom:0;padding-bottom:var(--sp-1)}
.rstep b{display:block;color:var(--t1);font-size:var(--fs-xs);margin-bottom:var(--sp-1)}
.rn{width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid var(--primary-lt);color:var(--primary);display:grid;place-items:center;font-family:'Sora';font-size:var(--fs-xs);font-weight:700;flex:0 0 19px;margin-top:var(--sp-1)}
.rbase{font-size:var(--fs-xs);color:var(--t3);margin-top:var(--sp-1);line-height:1.6}
.rruled{font-size:var(--fs-sm);color:var(--t2);padding:var(--sp-1) 0 4px 11px;border-left:2px solid var(--border);margin-top:var(--sp-1);line-height:1.6}

/* report */
.repsec{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:var(--sp-3) 15px;margin-bottom:var(--sp-2)}
.repsec.leak{border-color:var(--danger-bd);background:#FFFCFC}
.rsh{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1);flex-wrap:wrap}
.rsn{width:20px;height:20px;border-radius:50%;background:var(--primary-bg);color:var(--primary-h);display:grid;place-items:center;font-family:'Sora';font-size:var(--fs-xs);font-weight:700;flex:0 0 20px}
.rsf{font-size:var(--fs-xs);color:var(--t3);margin-bottom:var(--sp-2)}
.rst{font-size:var(--fs-sm);color:var(--t2);line-height:1.75}
.rsg{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-2)}
.figc{display:inline-flex;align-items:baseline;gap:var(--sp-1);background:var(--surface-tint);border:1px solid var(--border);border-radius:7px;padding:var(--sp-1) 9px;font-size:var(--fs-xs)}
.figc .num{font-weight:700;font-size:var(--fs-sm)}
.figc .src{color:var(--t3);font-size:var(--fs-xs);font-family:'Sora'}
.rsa{display:flex;gap:var(--sp-1);margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px solid var(--hairline)}
.secchip{font-size:var(--fs-xs);background:var(--surface-tint);border:1px solid var(--border);border-radius:12px;padding:var(--sp-1) 9px;color:var(--t2);white-space:nowrap}
.secchip.bad{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger-fg);font-weight:600}

/* knowledge */
.kcomp{display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#F5F3FF,#FFF7ED);border:1px solid #E9E3FE;border-radius:var(--r);padding:var(--sp-4) 18px;margin-top:var(--sp-4)}
.gapchip{display:inline-flex;align-items:center;padding:var(--sp-1) 11px;border:1px solid var(--danger-bd);background:var(--danger-bg);color:var(--danger-fg);border-radius:16px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap;transition:.13s}
.gapchip:hover{background:#FEE2E2}
.gapchip.warn{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-fg)}
.gapchip.warn:hover{background:#FEF3C7}
.asset-tools{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);flex-wrap:wrap}
.asset-search{flex:0 1 250px;min-width:210px;max-width:280px;height:34px}
.asset-types{display:flex;align-items:center;gap:var(--sp-2)}
.asset-type{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:18px;background:#fff;color:var(--t2);font-size:var(--fs-sm);font-weight:600;transition:.14s}
.asset-type:hover,.asset-type.on{border-color:var(--primary-lt);color:var(--primary);background:var(--primary-bg)}
.asset-select{height:34px;min-width:0;width:132px;padding:0 28px 0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--t2);font-size:var(--fs-sm)}
.asset-select.product{width:142px}
.asset-select.source{width:124px}
.asset-tags{display:flex;align-items:center;gap:var(--sp-2) 14px;margin:0 0 14px;overflow:hidden;white-space:nowrap;color:var(--t2);font-size:var(--fs-xs)}
.asset-tags.open{align-items:flex-start;flex-wrap:wrap;overflow:visible;white-space:normal;padding-bottom:var(--sp-1)}
.asset-tags .label{color:var(--t3);flex:0 0 auto}
.asset-tag{min-height:25px;padding:var(--sp-1) 0;font-weight:600;transition:.14s}
.asset-tag:hover{color:var(--primary)}
.asset-tag.on{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) 8px;border-radius:6px;background:var(--primary-bg);color:var(--primary)}
.asset-tag .tag-remove{width:14px;height:14px;display:grid;place-items:center;border-radius:50%;background:#DDD6FE;color:var(--primary);font-size:var(--fs-xs);line-height:1}
.asset-tag-more{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:25px;font-weight:600;color:var(--t2)}
.asset-tag-more:hover{color:var(--primary)}
.asset-tag-more svg{width:14px;height:14px;flex:0 0 14px;stroke-width:1.8}
.asset-custom-tag{min-height:25px;padding:var(--sp-1) 10px;border:1px dashed var(--border);border-radius:14px;color:var(--t3);font-weight:600}
.asset-custom-tag:hover{border-color:var(--primary-lt);color:var(--primary);background:#FAF8FF}
.kagrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3)}
.kacard{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:.14s;min-width:0}
.kacard:hover{border-color:var(--primary-lt);box-shadow:var(--sh-md)}
.kaimg{height:80px;background-size:cover;background-position:center;position:relative}
.kaimg .video-mark{position:absolute;top:50%;left:50%;width:38px;height:38px;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;background:rgba(20,16,45,.72);color:#fff;box-shadow:0 3px 12px rgba(20,16,45,.3);backdrop-filter:blur(3px);pointer-events:none}
.kaimg .video-mark svg{width:18px;height:18px;fill:currentColor;stroke-width:1.8;transform:translateX(1px)}
.ka-actions{display:flex;align-items:center;gap:var(--sp-1);color:var(--t3);flex:0 0 auto}
.ka-action{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;font-size:var(--fs-lg)}
.ka-action:hover{background:var(--primary-bg);color:var(--primary)}
.kacard.asset-selected{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.asset-card-check{position:absolute;top:var(--sp-2);left:var(--sp-2);z-index:3;width:22px;height:22px;display:grid;place-items:center;border:1px solid #fff;border-radius:50%;background:rgba(255,255,255,.9);color:transparent;font-size:var(--fs-xs);font-weight:800;box-shadow:var(--sh-sm)}
.asset-card-check.on{border-color:var(--primary);background:var(--primary);color:#fff}
.kagrid.asset-selecting{padding-bottom:84px}
.asset-more-menu{position:fixed;z-index:95;width:154px;padding:var(--sp-2);border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--sh-lg)}
.asset-more-menu button{display:flex;align-items:center;gap:var(--sp-2);width:100%;height:34px;padding:0 9px;border-radius:7px;color:var(--t2);font-size:var(--fs-sm);font-weight:600;text-align:left}
.asset-more-menu button:hover{background:var(--primary-bg);color:var(--primary)}
.asset-more-menu button.danger{color:var(--red)}
.asset-more-menu button.danger:hover{background:var(--danger-bg);color:var(--danger-fg)}
.asset-more-menu svg{width:15px;height:15px;flex:0 0 15px}
.asset-bulkbar{position:fixed;left:calc(50% + var(--sbw)/2);bottom:22px;z-index:55;transform:translateX(-50%);display:flex;align-items:center;gap:var(--sp-2);width:min(820px,calc(100vw - var(--sbw) - 48px));padding:10px 12px;border:1px solid var(--primary-bd);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:var(--sh-lg);backdrop-filter:blur(10px)}
.asset-bulkbar strong{font-size:var(--fs-sm);white-space:nowrap}
.asset-bulkbar .btn{height:36px;padding:0 13px}
.asset-select-all{display:inline-flex;align-items:center;gap:var(--sp-2);height:36px;padding:0 12px;border:1px solid var(--primary-bd);border-radius:9px;color:var(--primary);font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.asset-select-all span{width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--primary-bd);border-radius:4px;font-size:var(--fs-xs)}
.asset-select-all.on span{border-color:var(--primary);background:var(--primary);color:#fff}
.asset-associate-hint{margin-bottom:var(--sp-4);color:var(--t2);font-size:var(--fs-sm);line-height:1.65}
.asset-product-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.asset-product-option{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3);border:1px solid var(--border);border-radius:11px;background:#fff;text-align:left}
.asset-product-option:hover{border-color:var(--primary-lt);background:var(--surface-tint)}
.asset-product-option.on{border-color:var(--primary);background:var(--primary-bg)}
.asset-product-thumb{width:48px;height:48px;flex:0 0 48px;border-radius:8px;background-size:cover;background-position:center}
.asset-product-option>span:nth-child(2){flex:1;min-width:0}
.asset-product-option b,.asset-product-option small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-product-option b{font-size:var(--fs-md)}
.asset-product-option small{margin-top:var(--sp-1);color:var(--t3);font-size:var(--fs-xs)}
.asset-product-option>svg{color:transparent}
.asset-product-option.on>svg{color:var(--primary)}
.asset-link-tag-drawer{display:flex;flex-direction:column;gap:var(--sp-4)}
.asset-linked-tag-summary{position:sticky;top:0;z-index:4;height:96px;flex:0 0 96px;padding:var(--sp-3);border:1px solid var(--primary-bd);border-radius:10px;background:#fff;box-shadow:0 6px 16px rgba(60,30,140,.08)}
.asset-linked-tag-summary>b{display:block;margin-bottom:var(--sp-2);font-size:var(--fs-sm)}
.asset-linked-tag-chips{display:flex;align-content:flex-start;gap:var(--sp-1);flex-wrap:wrap;height:50px;overflow-y:auto}
.asset-linked-tag-chips button{display:inline-flex;align-items:center;gap:var(--sp-1);height:25px;padding:0 7px 0 9px;border:1px solid var(--primary-bd);border-radius:13px;background:var(--primary-bg);color:var(--primary);font-size:var(--fs-xs);font-weight:600}
.asset-linked-tag-chips button:hover{border-color:var(--primary);background:var(--primary-tint)}
.asset-linked-tag-chips button svg{width:12px;height:12px}
.asset-linked-tag-empty{color:var(--t3);font-size:var(--fs-xs)}
.asset-link-tag-section{border-top:1px solid var(--border);padding-top:var(--sp-4)}
.asset-link-tag-title{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.asset-link-tag-title b{font-size:var(--fs-md)}
.asset-link-tag-title span{color:var(--t3);font-size:var(--fs-xs)}
.asset-link-tag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.asset-link-tag-option{display:flex;align-items:center;gap:var(--sp-2);min-width:0;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--t2);font-size:var(--fs-sm);font-weight:600;text-align:left}
.asset-link-tag-option:hover{border-color:var(--primary-lt);background:var(--surface-tint)}
.asset-link-tag-option.on{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.asset-link-tag-option.mixed{border-color:var(--primary-bd);background:var(--primary-tint);color:var(--t2)}
.asset-link-tag-option>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-link-tag-check{width:17px;height:17px;display:grid;place-items:center;flex:0 0 17px;border:1px solid var(--primary-bd);border-radius:4px;background:#fff;color:transparent;font-size:var(--fs-xs);font-weight:800}
.asset-link-tag-option.on .asset-link-tag-check{border-color:var(--primary);background:var(--primary);color:#fff}
.asset-link-tag-option.mixed .asset-link-tag-check{border-color:var(--primary);background:#fff;color:var(--primary)}
.asset-tag-manager{display:flex;flex-direction:column;gap:var(--sp-4)}
.asset-tag-search-state{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 10px;border:1px solid var(--primary-bd);border-radius:8px;background:var(--primary-tint);color:var(--primary);font-size:var(--fs-sm);font-weight:600}
.asset-tag-search-state span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-tag-search-state button{width:24px;height:24px;display:grid;place-items:center;border-radius:5px}
.asset-tag-search-state button:hover{background:#fff}
.asset-tag-section{border:1px solid var(--border);border-radius:12px;background:#fff;padding:var(--sp-4)}
.asset-tag-section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.asset-tag-section-head>div{min-width:0}
.asset-tag-section-head b{display:block;font-size:var(--fs-md)}
.asset-tag-section-head span:not(.chip){display:block;margin-top:var(--sp-1);color:var(--t3);font-size:var(--fs-xs)}
.asset-locked-tags{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.asset-locked-tags>span{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:30px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-tint);color:var(--t2);font-size:var(--fs-sm);font-weight:600}
.asset-locked-tags svg{width:13px;height:13px;color:var(--t3)}
.asset-custom-tag-list{display:flex;flex-direction:column;gap:var(--sp-1)}
.asset-custom-tag-row,.asset-tag-edit-row{display:flex;align-items:center;gap:var(--sp-2);min-height:42px;padding:var(--sp-2) 8px var(--sp-2) 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.asset-custom-tag-row:hover{border-color:var(--primary-lt);background:var(--surface-tint)}
.asset-custom-tag-row>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm);font-weight:600}
.asset-custom-tag-row button,.asset-tag-edit-row button{width:28px;height:28px;display:grid;place-items:center;flex:0 0 28px;border-radius:6px;color:var(--t3)}
.asset-custom-tag-row button:hover,.asset-tag-edit-row button:hover{background:var(--primary-bg);color:var(--primary)}
.asset-custom-tag-row button.danger{color:var(--red)}
.asset-custom-tag-row button.danger:hover{background:var(--danger-bg);color:var(--danger-fg)}
.asset-tag-edit-row{border-color:var(--primary-lt);background:var(--primary-tint)}
.asset-tag-edit-row input{flex:1;min-width:0;height:30px;padding:0 var(--sp-2);border:1px solid var(--primary-bd);border-radius:6px;background:#fff;font-size:var(--fs-sm);outline:none}
.asset-tag-edit-row input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.asset-tag-empty{padding:var(--sp-5) 12px;text-align:center;color:var(--t3);font-size:var(--fs-sm)}
.asset-tag-manager-foot input{flex:1;min-width:0;height:36px;padding:0 11px;border:1px solid var(--primary-bd);border-radius:8px;background:#fff;font-size:var(--fs-sm);outline:none}
.asset-tag-manager-foot input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.asset-tag-manager-foot .btn{height:36px}

/* ---- one conversation per thread, scoped ---- */
function allC(t){
 const out=(t.cmts||[]).map(c=>({...c,sc:null}));
 (t.arts||[]).forEach(a=>{
  (a.sub||[]).forEach(m=>out.push({...m,sc:{k:'a',aid:a.id,label:a.ttl||a.ty}}));
  (a.opts||[]).forEach((o,i)=>(o.sub||[]).forEach(m=>out.push({...m,sc:{k:'o',aid:a.id,i,label:o.t}})));
  (a.rows||[]).forEach((r,i)=>(r.sub||[]).forEach(m=>out.push({...m,sc:{k:'r',aid:a.id,i,label:r.n}})));
 });
 return out;
}
function scopeJump(sc){

<script data-source="js/03-agents-recipes-proposals.js">
/* ============ plan adjustment ============ */

function canAdjustPrestartPlan(t){return !!(t?.prestartDemo&&t.plan.status==='pending'&&!t.plan.startedAt);}
function prestartAgents(){return REG.filter(a=>prestartPlanPreset(a.id)&&a.b==='live'&&a.enabled!==false&&ONLINE[a.id]);}
function prestartPlanNode(t){
 const pending=canAdjustPrestartPlan(t),a=AG[t.ag]||{},p=t.plan,d=S.prestartDraft?.tid===t.id?S.prestartDraft:null;
 const agentIds=t.agents?.length?t.agents:[t.ag];
 const manual=S.prestartManualTid===t.id;
 const rejecting=S.prestartReject?.tid===t.id;
 const rejected=p.status==='rejected';
 const planState=rejected?'未通过':pending?'待确认':t.st==='ask'?'已确认 · 等待补充':t.st==='done'?'已完成':t.st==='review'?'待审批':'已确认 · 执行中';
 return `<div class="node ${pending||rejected?'wait':['ask','review','done'].includes(t.st)?'ok':'act'}"><div class="nlab">计划 · PLAN</div><div class="bub prestart-plan">
  ${agentIds.length>1?`<div class="prestart-pair-head"><div class="prestart-pair-meta"><span class="chip mut">计划 v${p.v}</span><span class="tm">${planState}</span></div><div class="prestart-agent-pair">${agentIds.map(id=>{const label=t.agentLabels?.[id]||agentLabel(id),state=t.agentStates?.[id]||'待确认';return `<button class="prestart-agent-card" onclick="openTrace('${id}','${t.id}')" title="查看${esc(label)}运行状态">${AV(id,26)}<span class="prestart-agent-name">${esc(label)}</span><span class="prestart-agent-state">${esc(state)}</span></button>`;}).join('')}</div></div>`:`<div class="who agent-run-hit" role="button" tabindex="0" onclick="openTrace('${t.ag}','${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTrace('${t.ag}','${t.id}')}" title="查看运行状态"><span class="avs" style="background:${a.c}">${a.s}</span><span class="nm">${esc(a.n)}</span><span class="chip mut">计划 v${p.v}</span><span class="tm">${planState}</span></div>`}
  <div class="prestart-summary">${esc(p.tx)}</div>
  ${rejected?`<div class="prestart-rejected-note"><b>不通过原因：</b>${esc(p.feedback||'未填写')}</div>`:''}
  ${pending?(manual?`<div class="prestart-plan-editor"><div class="fld" style="margin:0"><label>执行 Agent</label><select id="prestart-agent-select">${prestartAgents().map(x=>`<option value="${x.id}" ${x.id===t.ag?'selected':''}>${esc(nick(x.id)||x.n)}</option>`).join('')}</select></div>
   <div class="prestart-plan-editor-actions"><button class="btn sm" onclick="saveManualPrestart('${t.id}')">保存调整</button><button class="btn ghost sm" onclick="cancelManualPrestart('${t.id}')">取消</button></div></div>`:d?`<div class="prestart-plan-editor">
   <textarea id="prestart-adjustment" rows="2" aria-label="计划调整要求" oninput="setPrestartDraft(this.value)">${esc(d.tx)}</textarea>
   <div class="prestart-plan-editor-actions"><button class="btn sm" onclick="savePrestartPlan('${t.id}')">改计划</button><button class="btn ghost sm" onclick="cancelPrestartPlan('${t.id}')">取消</button></div>
  </div>`:rejecting?`<div class="prestart-plan-editor">
   <textarea rows="2" aria-label="不通过原因" placeholder="填写不通过原因" oninput="setPrestartReject(this.value)">${esc(S.prestartReject.tx)}</textarea>
   <div class="prestart-plan-editor-actions"><button class="btn sm" onclick="confirmPrestartReject('${t.id}')">确定</button><button class="btn ghost sm" onclick="cancelPrestartReject('${t.id}')">取消</button></div>
  </div>`:`<div class="prestart-plan-actions"><button class="btn ghost sm" onclick="openPrestartPlan('${t.id}')">调整计划 ↗</button><button class="btn ghost sm" onclick="openManualPrestart('${t.id}')">手动调整</button><button class="btn sm" onclick="startPrestartPlan('${t.id}')">确认并开始</button><button class="prestart-reject-link" onclick="openPrestartReject('${t.id}')">不通过</button></div>`):''}
  ${!pending&&!rejected&&t.st!=='done'?`<div style="margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--hairline)"><button class="btn ghost sm" onclick="promoteThread()">变成例行 ↗</button></div>`:''}
 </div></div>`;
}
function manualPrestartAgents(){return REG.filter(a=>a.b==='live'&&a.enabled!==false&&ONLINE[a.id]);}
function manualPrestartDrawer(){
 const t=T.find(x=>x.id===S.prestartAgentTid);if(!t)return;
 const list=manualPrestartAgents(),picks=Array.isArray(S.prestartAgentPick)?S.prestartAgentPick:[];
 $('dw').innerHTML=`<div class="dw-h">
  <button class="ib" onclick="closeDw()" title="关闭"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <div style="flex:1;min-width:0"><div class="ty">调整计划 · Agent</div><h3>选择执行 Agent</h3></div>
  <span class="chip mut">${list.length} 个可用</span></div>
 <div class="dw-b"><div class="manual-agent-list">${list.map(a=>{const m=agAdmin(a),order=picks.indexOf(a.id),on=order>=0;return `<button class="manual-agent-row ${on?'on':''}" onclick="selectManualPrestartAgent('${a.id}')" aria-pressed="${on}">
  ${AV(a.id,36)}<span class="manual-agent-main"><span class="manual-agent-head"><span class="odot on"></span><span class="manual-agent-name">${esc(a.nick)}</span><span class="chip lv">${LV[a.lv].k} ${LV[a.lv].n}</span><span class="chip dom">${esc(a.dom)}</span></span>
  <span class="manual-agent-desc">${esc(a.d)}</span><span class="manual-agent-meta">成功率 ${a.ok}% · 平均评分 ${m.rating} · 准时率 ${m.ontime} · 风险 ${m.risk}</span></span>
  <span class="manual-agent-check">${on?order+1:''}</span></button>`}).join('')}</div></div>
 <div class="dw-f"><button class="btn" onclick="confirmManualPrestartAgent()" ${picks.length?'':'disabled'}>确认选择${picks.length?'（'+picks.length+'）':''}</button><button class="btn ghost" onclick="closeDw()">取消</button><span style="margin-left:auto;font-size:var(--fs-xs);color:var(--t3)">按选择顺序执行 · 确认后仍需批准计划</span></div>`;

function openManualPrestart(id){
 const t=T.find(x=>x.id===id);if(!canAdjustPrestartPlan(t))return toast('计划已开始执行，不能更换 Agent');
 S.prestartDraft=null;S.prestartReject=null;S.prestartManualTid=null;S.prestartAgentTid=id;S.prestartAgentPick=[...(t.agents?.length?t.agents:[t.ag])];
 manualPrestartDrawer();$('dw').classList.add('on');$('scrim').classList.add('on');

function selectManualPrestartAgent(id){
 if(!manualPrestartAgents().some(a=>a.id===id))return;
 const scrollTop=$('dw')?.querySelector('.dw-b')?.scrollTop||0;
 const picks=Array.isArray(S.prestartAgentPick)?[...S.prestartAgentPick]:[],i=picks.indexOf(id);
 if(i>=0)picks.splice(i,1);else picks.push(id);
 S.prestartAgentPick=picks;manualPrestartDrawer();
 const body=$('dw')?.querySelector('.dw-b');if(body)body.scrollTop=scrollTop;

function manualPrestartPlan(agents,t){
 if(agents.length===1){const preset=prestartPlanPreset(agents[0].id);return preset||{tx:t.plan.tx,expected:t.plan.expected,steps:t.plan.steps,reason:'由人工指定 '+agents[0].nick+' 执行；请在开始前再次确认其能力与当前任务匹配。'};}
 const ids=agents.map(a=>a.id),labels=agents.map(a=>agentLabel(a.id)),dual=ids.length===2&&ids[0]==='pdp'&&ids[1]==='insp';
 if(dual){
  const plan=prestartPlanPreset('pdp');
  plan.tx='详情页生成 Agent 先整理规划并生成内容，Brooks 批准后由店铺巡检 Agent 检查商品资料、页面信息与上架风险。两份产出分别经 Brooks 批准后，再交 dudu 统一验收、分别评分。';
  plan.steps.splice(plan.steps.length-1,0,{l:'店铺巡检检查页面与上架风险',m:'等待详情页产出经 Brooks 批准',s:'todo',r:'未开始'});

function vAgents(){

        <span class="chip dom">${r.dom}</span></div>
      <div style="font-size:var(--fs-sm);color:var(--t2);margin-top:var(--sp-1);line-height:1.6">${esc(r.d)}</div>

      <div class="num" style="font-size:var(--fs-sm);font-weight:600;white-space:nowrap">${sched?(PAUSED?'已暂停':r.next):r.used+' 次'}</div>
      ${sched?`<div style="font-size:var(--fs-xs);color:var(--t3);margin-top:var(--sp-1);white-space:nowrap">${r.freq} ${r.time}</div>`:''}</div>
  </div>
  <div class="pcp" style="border-top:0;background:transparent;padding:var(--sp-3) 16px 0">
    <span class="lb">链路</span>
    ${r.ag.map((x,i)=>`<span class="pstepc">${AV(x,16)} ${nick(x)}</span>`).join('<span style="color:var(--t3)">→</span>')}

  <div class="pca">
    ${r.gate?`<button class="btn sm" onclick="openGate('${r.id}')">看会执行什么 ↗</button>`:''}
    ${sched?`<button class="btn ghost sm" onclick="openRc('${r.id}')">排期与历史 ↗</button>
      <button class="btn ghost sm" onclick="newRoutine(RECIPES.find(x=>x.id==='${r.id}'),1)">编辑</button>
      ${r.st==='fail'?`<button class="btn ghost sm" onclick="toast('已重新启用 · 下次按原排期跑')">重新启用</button>`

function runRow(x){
 const t=x.tid?T.find(y=>y.id===x.tid):null;
 const tone=x.fail?'#B91C1C':x.gate?'#B45309':x.silent?'var(--t3)':'var(--t2)';
 return `<div class="runrow ${x.fail?'fail':x.gate?'gate':''}">
  <div style="display:flex;align-items:center;gap:var(--sp-2)">
    <span class="vv">${x.trig}</span>
    <span style="flex:1;min-width:0"><b style="font-size:var(--fs-sm)">${x.at}</b>
      <span style="display:block;font-size:var(--fs-xs);color:${tone};margin-top:var(--sp-1)">${esc(x.res)}</span></span>
    <span class="vd num">${x.dur}</span></div>
  ${t?`<button class="runlink" onclick="closeDw();go('thread','${t.id}')">
     <span class="st ${t.st}">${STN[t.st]}</span>
     <span style="flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span>
     ${x.art?`<span class="chip mut">${esc(x.art)}</span>`:''}
     <span style="color:var(--primary)">打开 →</span></button>`
   :x.silent?`<div class="runnote">未建线程 · 没有需要人处理的东西</div>`
   :x.gate?`<div class="runnote" style="color:var(--warn-fg)">卡在审批门 · 还未执行</div>`
   :x.fail?`<div class="runnote" style="color:var(--danger-fg)">未产出 · 已重试 0 次</div>`
   :x.arch?`<div class="runnote">${esc(x.arch)}</div>`:''}
 </div>`;
}

function composeChain(txt){
 const t=txt||'';
 let ag=[],why=[];
 CHAINRULES.forEach(r=>{if(r.k.some(k=>t.includes(k))&&!ag.includes(r.a)){ag.push(r.a);why.push(r.w);}});

/* ---- create a routine ---- */
const FREQ={'一次性':{t:'只跑一次，跑完自动停用。',n3:d=>[d||'明天 09:00','—','—']},
 '每天':{t:'每天同一时间。',n3:t=>['明天 '+t,'后天 '+t,'8月18日 '+t]},
 '每周':{t:'每周同一天同一时间。',n3:t=>['本周五 '+t,'8月22日 '+t,'8月29日 '+t]},
 '每月':{t:'每月同一日期。',n3:t=>['9月1日 '+t,'10月1日 '+t,'11月1日 '+t]}};
function scheduleDateValue(offset){
 const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(offset===undefined?1:offset));
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseScheduleDate(v){
 const p=(v||scheduleDateValue(1)).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0,0);
}
function formatScheduleRun(d,time){
 const day=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' · '+day+' '+(time||'09:00');
}
function routineNextRuns(n){
 const start=parseScheduleDate(n.date),time=n.time||'09:00',out=[];
 if(n.freq==='一次性')return [formatScheduleRun(start,time)];
 if(n.freq==='每天'){
  for(let i=0;i<3;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(formatScheduleRun(d,time));}
  return out;
 }
 if(n.freq==='每周'){
  const target=Number.isInteger(n.weekday)?n.weekday:start.getDay(),first=new Date(start);
  first.setDate(first.getDate()+((target-first.getDay()+7)%7));
  for(let i=0;i<3;i++){const d=new Date(first);d.setDate(first.getDate()+i*7);out.push(formatScheduleRun(d,time));}
  return out;
 }
 const day=Math.max(1,Math.min(31,+(n.monthday||1)));let y=start.getFullYear(),m=start.getMonth();
 while(out.length<3){const last=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(day,last),12,0,0,0);
  if(d>=start)out.push(formatScheduleRun(d,time));m++;if(m>11){m=0;y++;}}
 return out;
}
function normFreq(f){
 if(!f)return '每天';
 if(FREQ[f])return f;
 if(f.includes('一次'))return '一次性';
 if(f.includes('每天')||f.includes('每日'))return '每天';
 if(f.includes('每周'))return '每周';
 if(f.includes('每月'))return '每月';
 return '每天';
}

const DKEYS=Object.keys(DICT).sort((a,b)=>b.length-a.length);

let LANG='zh';
function setLang(l){LANG=l;render();}
function trs(v){
 if(LANG!=='en'||!v)return v;
 const k=v.trim();
 if(DICT[k])return v.replace(k,DICT[k]);
 let out=v;
 for(const key of DKEYS){if(out.indexOf(key)>=0)out=out.split(key).join(DICT[key]);}
 return out;
}
function trDOM(root){
 if(LANG!=='en'||!root)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
 const ns=[];let n;while((n=w.nextNode()))ns.push(n);
 ns.forEach(x=>{const v=trs(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v;});
 root.querySelectorAll('[placeholder]').forEach(e=>{const v=trs(e.getAttribute('placeholder'));if(v)e.setAttribute('placeholder',v);});
 root.querySelectorAll('[title]').forEach(e=>{const v=trs(e.getAttribute('title'));if(v)e.setAttribute('title',v);});
}
function trAll(){['view','dw','mod','sb','top'].forEach(id=>{const e=$(id);if(e)trDOM(e);});}

function kpNormHeader(v){return String(v||'').replace(/[\s*\/\-_:：·.（）()×]/g,'').toLowerCase();}
function kpParseImport(rows){

 Object.entries({产品图:'productImage',产品图片URL:'productImage',包装图URL:'packageImage',净重:'netWeight',规格:'dimensions','规格CM(长*宽*高)':'dimensions',SKU:'sku'}).forEach(([label,key])=>map.set(kpNormHeader(label),key));
 const products=[];let duplicates=0;
 rows.forEach(row=>{
  const p=kpNewProduct(products);let found=false;
  Object.entries(row).forEach(([header,raw])=>{
   const key=map.get(kpNormHeader(header)),value=String(raw??'').trim();if(!key||!value)return;found=true;
   if(key==='sku'){p.sku=value;return;}
   if(key==='productImage'||key==='packageImage'){p.details[key]=value.split(/[\n|]+/).map(v=>v.trim()).filter(kpSafeImageUrl).map((url,n)=>({name:`${key==='productImage'?'产品图':'包装图'}${n+1}`,url}));return;}
   if(key==='dimensions'){const dims=value.split(/[xX×*＊]/).map(v=>v.trim().replace(/\s*cm$/i,''));if(dims.length===3&&dims.every(v=>v!==''&&Number.isFinite(Number(v))&&Number(v)>=0))kpSetValue(p,key,dims);return;}
   p.details[key]=value;
  });
  if(!found)return;if([...PRODS,...products].some(x=>x.sku===p.sku)){duplicates++;return;}
  p.n=p.details.declarationName||'未命名产品';products.push(p);
 });
 return {products,duplicates};
}

function toggleAssetMore(event,i){

 const current=$('asset-more-menu');if(current&&Number(current.dataset.index)===i){closeAssetMoreMenu();return;}

 fans:[['all','全部粉丝数'],['under1','1万以下'],['1to5','1万–5万'],['5to10','5万–10万'],['10to50','10万–50万'],['over50','50万及以上']],

function kCreatorFans(value){
 const text=String(value||'').replace(/,/g,'').trim(),number=parseFloat(text);
 if(!Number.isFinite(number))return null;
 return number*(/亿/.test(text)?1e8:/万/.test(text)?1e4:/k/i.test(text)?1e3:/m/i.test(text)?1e6:1);
}
function kCreatorMatches(r){
 const f=S.kCreatorFilters||{},query=(S.kCreatorSearch||'').trim().toLocaleLowerCase();
 if(query&&![r.n,r.h,...(r.tags||[])].join(' ').toLocaleLowerCase().includes(query))return false;
 const ranges={under1:[0,1e4],'1to5':[1e4,5e4],'5to10':[5e4,1e5],'10to50':[1e5,5e5],over50:[5e5,Infinity]};
 if(ranges[f.fans]){const n=kCreatorFans(r.f),[min,max]=ranges[f.fans];if(n===null||n<min||n>=max)return false;}
 const rawActivity=r.activity||r.activityLevel;
 const activity=({'高活跃':'high','中活跃':'medium','低活跃':'low',high:'high',medium:'medium',low:'low'})[rawActivity]||'unknown';
 if(f.activity&&f.activity!=='all'&&activity!==f.activity)return false;
 const formats=Array.isArray(r.formats)?r.formats:(r.rates||[]).map(rate=>rate.trim().split(/\s/)[0]);
 if(f.format&&f.format!=='all'&&!formats.includes(f.format))return false;
 const favorite=r.favorite===true||r.favorite===1;
 if(f.favorite==='yes'&&!favorite||f.favorite==='no'&&favorite)return false;
 return true;
}

 S.aid=id;S.oi=(oi===undefined?null:oi);S.dtab=0;S.pc=false;S.focus=false;S.cr=null;S.brief=null;S.audit=null;S.auditCreator=null;
 const [,openedArtifact]=findArt(id);if(openedArtifact?.mode==='csa')S.pc=true;
 if(id==='a2')S.planSections={0:true};
 drawDw();$('dw').classList.add('on');$('scrim').classList.add('on');
 document.querySelectorAll('.pk').forEach(e=>e.classList.remove('sel'));
 const p=$('pk-'+id);if(p)p.classList.add('sel');
}
function openReview(id){
 const [,a]=findArt(id);
 if(a?.listing){openDw(id);toggleListingComment();return;}
 if(a?.inspection||a?.sentiment){openDw(id);S.pc=true;drawDw();scrollDrawerToBottom();return;}
 const tab=a.mode==='pdpseq'?2:a.ty==='视频'?3:a.ty==='详情页'?3:a.ty==='客服回复'?2:2;
 openDw(id);S.dtab=tab;drawDw();
 scrollDrawerToBottom();
}
function scrollDrawerToBottom(){
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const body=document.querySelector('#dw .dw-b');
  if(body)body.scrollTop=body.scrollHeight;
 }));
}
function closeDw(){S.ag=null;S.trace=null;S.prop=null;S.hot=null;S.kb=null;S.brief=null;S.kfilterOpen=null;S.auditCreator=null;S.prestartAgentTid=null;S.prestartAgentPick=null;if(S.trT){clearInterval(S.trT);S.trT=null;}$('dw').classList.remove('on','focus','expanded');$('scrim').classList.remove('on');S.focus=false;syncDrawerExpandControl();
 document.querySelectorAll('.pk').forEach(e=>e.classList.remove('sel'));}
function openHistoryArtifact(tid,index){
 const t=T.find(x=>x.id===tid),x=t&&t.log&&t.log[index];if(!t||!x||x.silent)return;
 const a=AG[t.ag]||{},title=x.art||x.res,agentName=nick(t.ag)||a.n||'Agent';
 $('dw').classList.remove('focus','expanded');
 $('dw').innerHTML=`<div class="dw-h">
   <button class="ib" onclick="closeDw()" title="关闭"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
   <div style="flex:1;min-width:0"><div class="ty">${esc(t.t)} · 历史产出</div><h3>${esc(title)}</h3></div>
  </div>
  <div class="dw-b">
   <div class="card">
    <div class="card-t">归档产出 <span class="chip lv">${x.arts||1} 个产出 · 已归档</span></div>
    <div class="ctx">
      <div class="ctxr"><span class="k">运行时间</span><span class="v">${esc(x.at)}</span></div>
      <div class="ctxr"><span class="k">运行结果</span><span class="v">${esc(x.res)}</span></div>
      <div class="ctxr"><span class="k">执行 Agent</span><span class="v">${esc(agentName)}</span></div>
      <div class="ctxr"><span class="k">归档状态</span><span class="v">已归档</span></div>
    </div>
    <div class="note" style="margin-top:var(--sp-3)">这是该次例行运行留下的历史产出。当前原型只做归档展示，不影响今天的待审批内容。</div>
   </div>
  </div>`;
 $('dw').classList.add('on');$('scrim').classList.add('on');syncDrawerExpandControl();
}
document.addEventListener('click',e=>{
 const drawer=$('dw'),button=e.target.closest('button');
 if(!drawer?.classList.contains('on')||!button||!drawer.contains(button)||button.disabled)return;
 if(button.textContent.replace(/\s+/g,'').trim()!=='批准')return;
 setTimeout(()=>{if(drawer.classList.contains('on'))closeDw();},0);
});
function toggleFocus(){S.focus=!S.focus;$('dw').classList.toggle('focus',S.focus);drawDw();}

function toggleDrawerExpanded(){
 const drawer=$('dw');if(!drawer||!drawer.classList.contains('on'))return;
 drawer.classList.toggle('expanded');syncDrawerExpandControl();
}
function syncDrawerExpandControl(){
 const drawer=$('dw'),head=drawer&&drawer.querySelector('.dw-h');if(!head)return;
 let button=head.querySelector('.dw-expand-toggle');
 if(!button){
  button=document.createElement('button');button.type='button';button.className='dw-expand-toggle';
  button.onclick=toggleDrawerExpanded;
  const title=[...head.children].find(el=>el.tagName==='DIV'&&/flex\s*:\s*1/.test(el.getAttribute('style')||''));
  head.insertBefore(button,title?title.nextElementSibling:null);
 }
 const expanded=drawer.classList.contains('expanded'),state=expanded?'expanded':'default';
 if(button.dataset.state!==state){
  button.dataset.state=state;
  button.title=expanded?'把抽屉收回原来的宽度':'把抽屉向左拉宽，方便看长内容';
  button.setAttribute('aria-label',button.title);
  button.setAttribute('aria-pressed',expanded?'true':'false');
  /* inline SVG — never depends on the icon library loading */
  const icon=expanded
   ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h6v6"/><path d="M19 5l-7 7"/><path d="M11 19H5v-6"/><path d="M5 19l7-7"/></svg>'
   : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M4 4l7 7"/><path d="M15 20h5v-5"/><path d="M20 20l-7-7"/></svg>';
  button.innerHTML=icon+'<span>'+(expanded?'收起':'加宽')+'</span>';
 }
}
function dtab(i){
 S.dtab=i;const [,a]=findArt(S.aid);
 if(a&&a.mode==='csa'){S.pc=i===0;if(i===1)a.csa.emailIndex=null;}
 if(a&&a.mode==='roster'){S.audit=null;if(i!==0)S.auditCreator=null;}
 else if(i!==1)S.audit=null;
 drawDw();
}
function stepArt(d){
 const t=T.find(x=>x.id===S.tid);const i=t.arts.findIndex(a=>a.id===S.aid);
 const n=i+d;if(n<0||n>=t.arts.length)return;openDw(t.arts[n].id);
}
function detailDirectionIndex(a){
 const i=S.oi===null||S.oi===undefined?0:S.oi;
 return Math.max(0,Math.min(a.opts.length-1,i));
}
function stepDirection(d){
 const [,a]=findArt(S.aid);if(!a||!a.opts)return;
 const n=detailDirectionIndex(a)+d;if(n<0||n>=a.opts.length)return;
 S.oi=n;S.dtab=0;S.pc=false;drawDw();
}
function drawDw(){
 const [t,a]=findArt(S.aid);if(!a)return;

   <div class="dw-tabs">${['文档','录入数据 '+creatorContents(r,S.cr).length,'合作记录 '+creatorCollabs(r,S.cr).length,'本次沟通 '+rosterSubCount(r),'匹配度'].map((x,j)=>`<button class="${(S.crtab||0)===j?'on':''}" onclick="S.creatorCollab=null;S.crtab=${j};drawDw()">${x}</button>`).join('')}</div>

     <span style="margin-left:auto;font-size:var(--fs-xs);color:var(--t3)">档案为只读 · 沟通记录属于本次合作</span></div>`;

else if(a.mode==='pptfile'){

 }
else if(a.mode==='pptoutline'){
 tabs=['当前大纲','版本'];
 body=[dPptOutline(a),dVer(a)][S.dtab];
 }
else if(a.mode==='csa'){
 tabs=['文档','邮件'];

 }
 else if(a.mode==='plans'){

   tabs=['文档','图片','版本'];body=[dPlanDoc(a,plan,planIndex)+planComments,dPlanImgs(plan)+planComments,dVer(a)][S.dtab];
  }
 }
 else if(isStandaloneDirection){

   tabs=['内容方向','版本'];body=[dSeoDirection(a,directionIndex),dVer(a)][S.dtab];
  }else if(isActivityDirection&&direction.activityPlanReady){
   tabs=['当前活动策划','创意方向','版本'];body=[dActivityPlanPreview(),dDetailDirection(a,directionIndex),dVer(a)][S.dtab];
  }else if(isDetailDirection&&direction.planReady&&direction.imagesGenerated){
   tabs=['图片','当前规划表','创意方向','版本'];body=[dDirectionImages(a,directionIndex),dDirectionPlanPreview(a,directionIndex),dDetailDirection(a,directionIndex),dVer(a)][S.dtab];

  }else{

  }

 }

 else if(a.mode==='roster'){tabs=['名单','内容审核','效果分析','版本'];body=[dRoster(a),dContentAudit(a),dEffectAnalysis(a),dVer(a)][S.dtab];}

function csaAnswerFor(q){
 const s=q.toLowerCase();
 if(s.includes('roas')||s.includes('投放'))return {text:'近 7 天 ROAS 为 2.6，低于 30 天均值 3.2。主要拖累来自春季新品广告组：点击成本上升 18%，但落地页加购率没有同步改善。建议先缩小低意向人群预算，并保留品牌词与高复购人群进行对照。',source:'口径：广告归因 ROAS · 近 7 天 · 来源：广告平台、店铺订单'};
 if(s.includes('库存')||s.includes('可售'))return {text:'当前库存可售天数为 4.3 天，低于健康区间 7–90 天。风险主要集中在 A80 修护精华 30ml；按近 7 天销量估算，若周末活动如期开始，可能在第 4 天出现断货。',source:'口径：可售库存 ÷ 近 7 天日均销量 · 数据截至今天 07:00 · 来源：库存系统'};
 if(s.includes('页面')||s.includes('详情'))return {text:'移动端页面承接仍是更强的异常信号。首屏停留时长下降 11%，权益模块到达率下降 8 个百分点；桌面端没有同方向变化。建议优先检查首屏加载、主卖点与会场权益是否在一屏内表达清楚。',source:'口径：移动端详情页访问行为 · 近 7 天 · 来源：店铺分析'};
 if(s.includes('流量')||s.includes('访客'))return {text:'流量总量增长 12%，但增长主要来自春季新品广告和泛兴趣人群，自然流量基本持平。新增流量的支付转化率为 0.8%，低于站内自然流量的 1.7%，说明流量结构确实放大了整体转化下滑。',source:'口径：渠道访客与支付转化率 · 近 7 天 · 来源：广告平台、店铺分析'};
 return {text:'从当前数据看，这个变化同时受到流量结构与移动端页面承接影响。能够确认的是转化下降主要发生在移动端，并在新增广告流量中更明显；暂时没有足够证据把原因归到单一因素。可以继续按渠道、设备或用户类型往下拆。',source:'口径：店铺支付转化率 · 近 7 天 · 来源：店铺分析、广告平台'};
}

function sendCSAQuestion(id,kind='note'){
 const i=$('csa-question'),q=i&&i.value.trim();if(!q){toast('先输入一个数据问题');return;}

function csaEmails(a){

function confirmListingStep(id,i){
 const [,a]=findArt(id),l=listingState(a);
 if(![0,1,2,3].includes(i)||l.confirmed[i]||l.loading!==null||l.rejected)return;
 if(i===0&&!PRODS.some(p=>p.sku===l.selected)){toast('请先选择上架商品');return;}
 if(i===1){
  if(!l.confirmed[0]){toast('请先确认上架产品');return;}
  for(const [key,value]of Object.entries(l.fields))if(!value.trim()){
   l.open[1]=true;refreshListingCard(a);if(S.aid===id)drawDw();($('listing-card-'+key)||$('listing-'+key))?.focus();toast('请填写完整的商品字段');return;
  }
  if(!l.image){toast('请选择商品主图');return;}
 }
 if(i===2){
  if(!l.confirmed[0]||!l.confirmed[1]){toast('请先确认上架产品与商品字段');return;}
  if(!l.receipt?.image||l.receipt.failed){toast('请先查看有效的平台回执截图');return;}
 }
 if(i===3){
  if(!l.confirmed[2]){toast('请先批准平台回执截图');return;}
  if(!l.final?.image||l.final.failed){toast('请先查看有效的商品上架结果截图');return;}
 }
 l.confirmed[i]={by:'du',at:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})};
 l.open[i]=false;
 if(i<3){
  l.loading=i+1;l.open[i+1]=true;refreshListingCard(a);if(S.aid===id)drawDw();
  const messages=['','AI 正在生成商品字段…','AI 正在提交并等待平台回执…','AI 正在执行商品上架…'];toast(messages[i+1]);
  setTimeout(()=>finishListingGeneration(id,i+1),2000);
  return;
 }
 if(i===3){
  const [task]=findArt(id);a.st='done';a.rows[0].s='回执已确认';
  a.ex='平台回执与商品上架结果均已确认，商品已完成发布。';a.vals=[{l:'商品字段',v:'已确认',s:'ok'},{l:'商品上架',v:'已完成',s:'ok'}];
  task.plan.steps[task.plan.steps.length-1]={l:'商品上架结果已确认',m:'最终截图 · 人工确认完成',s:'ok',r:'刚刚'};
  if(task.arts.every(x=>x.st==='done'))task.st='done';
  a.rows[0].sub.push({k:'sys',tx:'dudu 已确认商品上架结果截图。',at:'刚刚'});render();
 }
 refreshListingCard(a);drawDw();
 toast('商品上架结果已批准');
}
function finishListingGeneration(id,step){
 const [,a]=findArt(id);if(!a?.listing)return;const l=listingState(a);if(l.loading!==step)return;
 if(step===2){l.receipt.image=l.receipt.source;l.receipt.failed=false;}
 if(step===3){l.final.image=l.final.source||l.receipt.source;l.final.failed=false;}
 l.loading=null;l.open[step]=true;refreshListingCard(a);if(S.aid===id)drawDw();
 toast(step===1?'商品字段已生成':step===2?'平台回执已返回，请确认':'商品已上架，最终截图已返回');
}

${BRIEFT.hook}

/* ============ sub-thread ============ */

function subMsgs(arr){
 return (arr||[]).map(m=>{
  if(m.k==='sys')return `<div class="sysln"><span>${esc(m.tx)}</span></div>`;

    <span class="avs" style="background:${p.c}">${p.s}</span>

      ${isAg?'<span class="chip dom">Agent</span>':''}

      <div class="tx">${mHTML(m.tx)}</div></div></div>`;
 }).join('')||'<div style="font-size:var(--fs-sm);color:var(--t3);padding:var(--sp-3) 0;text-align:center">还没有评论记录。有判断就写在这里——它只属于这个产出。</div>';
}
function scopeNote(a,oi){
 const kids=a.opts||a.rows||a.plans;
 if(oi===null||oi===undefined)return '这条评论只落在<b>这个产出</b>上，不会打扰线程里的其他产出。';
 const x=kids[oi];
 const group=a.plans?'同一组方案':a.rows?'同一份名单':'同一组方向';
 return '这条评论只落在<b>'+esc(x.t||x.n)+'</b>上——'+group+'里的其他 '+(kids.length-1)+' 个看不到，也不会被改动。';
}
function subPane(a,oi){
 const kids=a.opts||a.rows||a.plans;
 const activeEmail=a.mode==='csa'&&S.dtab===1?activeCSAEmail(a):null;
 const emailThread=activeEmail?(activeEmail.thread=activeEmail.thread||{t:a.csa.customer+' · 客户邮件',sub:[]}):null;
 const x=emailThread||((oi===null||oi===undefined)?a:kids[oi]);
 const label=emailThread?emailThread.t:((oi===null||oi===undefined)?a.ttl:(x.t||x.n));
 const unit=a.plans?'方案':'产出';
 const peopleOnly=a.mode==='roster';

 return `<div class="sub-w">
   <div class="sub-h"><span class="t">评论</span><span class="chip mut">${esc(label.slice(0,18))}</span>

    ${a.inspection?.explaining?`<div style="display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0;color:var(--primary);font-size:var(--fs-sm)" role="status"><span class="spin" aria-hidden="true"></span>${esc(nick(a.by)||'店铺巡检')}正在解释…</div>`:''}</div>
   ${a.rows&&!a.listing?`<div class="collab-meta">
     ${a.mode==='roster'?`<label class="collab-field"><span>合作状态</span><select onchange="kolSet(${oi},this.value)">${Object.keys(RST).map(s=>`<option ${s===x.s?'selected':''}>${s}</option>`).join('')}</select></label>`:''}
     <label class="collab-field"><span>配合度</span><select onchange="setCreatorField('${a.id}',${oi},'coop',this.value,'配合度')">${['高','中','低'].map(s=>`<option ${s===(x.coop||'中')?'selected':''}>${s}</option>`).join('')}</select></label>
     <label class="collab-field"><span>负责人</span><select onchange="setCreatorField('${a.id}',${oi},'commOwner',this.value,'负责人')">${['待分配','jack','dudu','Sophie','Sam'].map(s=>`<option ${s===(x.commOwner||'待分配')?'selected':''}>${s}</option>`).join('')}</select></label>
   </div>`:''}
   <div class="sub-c">
     <div style="position:relative"><div id="m-si"></div>
       <textarea id="si" oninput="onKey(event,'si',${peopleOnly})" placeholder="${peopleOnly?'写给同事看 → 对同事说。输入 @ 提到人。':'写给同事看 → 对同事说；写给 Ai 改 → 对Ai说。输入 @ 提到人。'}"></textarea></div>
     <div class="row2">
       ${peopleOnly?'':a.mode==='csa'&&S.dtab===0?`<button class="btn sm" onclick="subSend('ask','${a.id}',${oi===undefined?null:oi})">对Ai说</button>`:`<button class="btn sm" onclick="subSend('chg','${a.id}',${oi===undefined?null:oi})">对Ai说</button>`}
       <button class="btn ghost sm" onclick="subSend('note','${a.id}',${oi===undefined?null:oi})">对同事说</button>
      <button class="btn ghost sm" data-mention-toggle onclick="showMent('si',${peopleOnly},this)" title="提到某人">@</button>
     </div></div></div>`;
}
function setCreatorField(id,oi,key,value,label){
 const [,a]=findArt(id);if(!a||!a.rows||!a.rows[oi])return;
 a.rows[oi][key]=value;toast(a.rows[oi].n+' · '+label+'：'+value);
}
function subSend(kind,id,oi){
 const i=$('si');if(!i||!i.value.trim()){toast('先写点什么');return;}
 const [,a]=findArt(id);const kids=a.opts||a.rows||a.plans;const activeEmail=a.mode==='csa'&&S.dtab===1?activeCSAEmail(a):null;const x=activeEmail?(activeEmail.thread=activeEmail.thread||{t:a.csa.customer+' · 客户邮件',sub:[]}):((oi===null)?a:kids[oi]);
 x.sub=x.sub||[];
 const tx=i.value.trim();x.sub.push({w:'du',k:kind==='chg'?'chg':undefined,tx,at:'刚刚'});
 if(a.mode==='csa'){
  if(S.dtab===1){drawDw();const l=$('sl');if(l)l.scrollTop=l.scrollHeight;toast(kind==='chg'?'邮件修改要求已记录':'已留言');return;}
  if(kind==='note'){drawDw();const l=$('sl');if(l)l.scrollTop=l.scrollHeight;toast('已留言');return;}
  const ans=csaAnswerFor(tx);x.sub.push({w:'csa',k:'ag',tx:ans.text+' '+ans.source,at:'刚刚'});a.v++;
  if(kind==='chg')x.sub.push({k:'sys',tx:'已更新数据分析结论 · 口径与来源同步刷新'});
  drawDw();const l=$('sl');if(l)l.scrollTop=l.scrollHeight;toast(kind==='chg'?'分析结论已按要求更新':'客户成功已回复');return;
 }
 if(a.mode==='promoseq'){
  if(kind==='chg')promotionNeedsReview(a);
  render();drawDw();scrollDrawerToBottom();toast(kind==='chg'?'修改要求已记录，等待推广计划处理':'已留言');return;
 }
 if(a.listing){
  a.listing.commentDraft='';refreshListingCard(a);drawDw();scrollDrawerToBottom();
  const list=$('sl');if(list)list.scrollTop=list.scrollHeight;
  toast(kind==='chg'?'修改要求已记录，已确认步骤保持锁定':'已留言');return;
 }
 if(a.sentiment){
  if(kind==='chg'){
   delete a.sentiment.result;a.st='review';
   const [task]=findArt(id);task.st='review';
  }
  render();drawDw();scrollDrawerToBottom();
  const list=$('sl');if(list)list.scrollTop=list.scrollHeight;
  toast(kind==='chg'?'修改要求已记录，等待舆情监控处理':'已留言');return;
 }
 if(a.inspection){
  if(kind==='chg'){
   delete a.inspection.result;a.st='review';
   const [task]=findArt(id);task.st='review';
  }
  render();drawDw();scrollDrawerToBottom();
  const list=$('sl');if(list)list.scrollTop=list.scrollHeight;
  toast(kind==='chg'?'修改要求已记录，等待'+(nick(a.by)||'店铺巡检')+'处理':'已留言');return;
 }
 if(kind==='chg'){
  const g=AG[a.by];
  x.sub.push({w:a.by,k:'ag',tx:'收到。已按你的说明改这一处，其余内容保持不变。改动会作为 diff 进入反馈回路。',at:'刚刚'});
  if(oi===null){a.v++;x.sub.push({k:'sys',tx:'已生成 v'+a.v+' · 变更 1 处'});a.st='review';}
  else{
   if(a.demoSocial){a.v++;x.s='review';a.st='review';const [task]=findArt(id);if(task)task.st='review';x.sub.push({k:'sys',tx:'已生成 v'+a.v+' · 仅更新这篇文章，其余 '+(a.plans.length-1)+' 篇未动'});}
   else x.sub.push({k:'sys',tx:a.rows?'已更新「'+x.n+'」· 其余 '+(a.rows.length-1)+' 位未动':a.plans?'已重写该方案 · 其余 '+(a.plans.length-1)+' 个方案未动':'已重写该方向'});
  }
  toast('已在这个产出上生成新版本');
 } else toast('已留言');
 drawDw();
 const l=$('sl');if(l)l.scrollTop=l.scrollHeight;
}

function openNew(agid,prefill){
 S.newAgent=agid||null;
 const a=S.newAgent?REG.find(x=>x.id===S.newAgent):null;
 const currentCampaign=CAMPS.some(c=>c.id===S.cid)?S.cid:'';S.newCampaignId=currentCampaign;
 $('mod').innerHTML=`<div class="mbox new-task-modal">

function inferNewTaskMeta(intent){
 const text=(intent||'').toLowerCase();
 const analysis=/(转化率|会话数|加购|数据时间|店铺分析|指标|漏斗|roas|gmv)/i.test(text);
 const dom=S.newAgent?(REG.find(x=>x.id===S.newAgent)?.dom||'内容')
  :analysis?'平台'
  :/(达人|kol|koc|brief)/i.test(text)?'KOL'
  :/(b2b|seo|白皮书|行业客户)/i.test(text)?'B2B'
  :/(用户运营|社群|会员|召回|留存)/i.test(text)?'用户运营'
  :/(电商|商品|详情页|上架|天猫|京东|直播|推广图)/i.test(text)?'电商':'内容';
 const campaignField=$('new-task-campaign'),campaignId=campaignField?campaignField.value:(S.newCampaignId||'');
 const matched=CAMPS.find(c=>c.id===campaignId)||null;
 return {d:dom,c:matched?matched.n:null,a:analysis?'ana':null};
}

  S.newAgent=null;closeMod();S.view='thread';S.tid=id;renderNav();render();$('view').scrollTo(0,0);toast(dualDemo?'任务已创建 · 已推荐 2 个 Agent，计划待确认':'任务已创建 · 已推荐详情页生成 Agent，计划待确认');return;
 }
